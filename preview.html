<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>USER BANK STATEMENT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f3f4f6;
    font-family:Arial,sans-serif;
    color:#111;
}

.container{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    margin:5px 0 20px;
    font-size:26px;
}

.filters{
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    margin-bottom:15px;
}

.filter-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.filter-box{
    flex:1;
    min-width:220px;
}

.filter-box label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

select,
input[type="date"]{
    width:100%;
    height:42px;
    padding:8px 10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
    font-size:15px;
}

.info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.info-box{
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
    text-align:center;
}

.info-title{
    font-size:14px;
    color:#555;
    margin-bottom:7px;
}

.info-value{
    font-size:20px;
    font-weight:bold;
}

.opening{
    color:#0066cc;
}

.debit{
    color:#d00000;
}

.credit{
    color:#008000;
}

.closing{
    color:#111;
}

.table-box{
    width:100%;
    overflow-x:auto;
    background:#fff;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

thead{
    background:#222;
    color:#fff;
}

th,
td{
    padding:10px 8px;
    border:1px solid #ddd;
    text-align:center;
    white-space:nowrap;
}

th{
    font-size:14px;
}

td{
    font-size:14px;
}

.credit-row{
    background:#f1fff1;
}

.debit-row{
    background:#fff5f5;
}

.total-row{
    background:#eee;
    font-weight:bold;
}

.loading{
    padding:20px;
    text-align:center;
    font-weight:bold;
}

.error{
    padding:15px;
    margin-top:10px;
    color:#b00000;
    background:#fff0f0;
    border:1px solid #ffcccc;
    border-radius:6px;
    display:none;
}

.no-data{
    text-align:center;
    padding:20px;
    font-weight:bold;
    color:#777;
}

@media(max-width:800px){

    .info{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .container{
        padding:8px;
    }

    h1{
        font-size:21px;
    }

    .filter-box{
        min-width:100%;
    }

    .info{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>USER BANK STATEMENT</h1>

        >
            ₹0
        </div>

    </div>


    <div class="info-box">

            Total Debit
        </div>

        <div
            class="info-value debit"
            id="totalDebit"
        >

        </div>

    </div>


    <div class="info-box">

        <div class="info-title">
            Total Credit
        </div>

        <div
            class="info-value credit"

            ₹0
        </div>

    </div>


    <div class="info-box">

        <div class="info-title">

        </div>

        <div

</div>

<div class="table-box">

        id="loading"
        class="loading"
    >
        Select User ID
    </div>


    <table

        style="display:none;"
    >

        <thead>

            <tr>

                <th>Date / Time</th>

                <th>Particulars</th>

                <th>Debit</th>

                <th>Credit</th>

                <th>Balance</th>

            </tr>

        </thead>

        <tbody id="statementBody">

        </tbody>

    </table>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";


/*
   IMPORTANT:

   YAHAN APNE PURANE WORKING CODE KI
   SAME SUPABASE ANON KEY LAGAO.
*/

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const userSelect =
document.getElementById("userSelect");

const fromDate =
document.getElementById("fromDate");

const toDate =
document.getElementById("toDate");

const statementBody =
document.getElementById("statementBody");

const statementTable =
document.getElementById("statementTable");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const openingBalance =
document.getElementById("openingBalance");

const totalDebit =
document.getElementById("totalDebit");

const totalCredit =
document.getElementById("totalCredit");

const closingBalance =
document.getElementById("closingBalance");


/* =========================================================
   STATUS
========================================================= */

const ACCEPTED_STATUS = [

    "accepted",
    "accept",
    "approved",
    "approve",
    "success",
    "successful",
    "completed",
    "complete",
    "clear",
    "cleared"

];


/* =========================================================
   MONEY
========================================================= */

function money(value){

    value =
        Number(value || 0);

    /*
       Minus sign display nahi karna.
    */

    value =
        Math.abs(value);

    return "₹" +
        value.toLocaleString("en-IN");

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    errorBox.style.display =
        "block";

    errorBox.innerText =
        message;

}


function hideError(){

    errorBox.style.display =
        "none";

    errorBox.innerText =
        "";

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDateTime(value){

    if(!value){
        return "";
    }

    const d =
        new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}


/* =========================================================
   GET ALL ROWS
========================================================= */

async function getAllRows(
    tableName,
    columns="*",
    filterColumn=null,
    filterValue=null
){

    let all = [];

    let from = 0;

    const pageSize = 1000;


    while(true){

        let query =
            supabaseClient
            .from(tableName)
            .select(columns)
            .range(
                from,
                from + pageSize - 1
            );


        if(
            filterColumn !== null &&
            filterValue !== null
        ){

            query =
                query.eq(
                    filterColumn,
                    filterValue
                );

        }


        const {
            data,
            error
        } =
            await query;


        if(error){

            console.error(
                tableName,
                error
            );

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            break;

        }


        all =
            all.concat(data);


        if(
            data.length <
            pageSize
        ){

            break;

        }


        from +=
            pageSize;

    }


    return all;

}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsers(){

    hideError();

    loading.style.display =
        "block";

    loading.innerText =
        "Users load ho rahe hain...";


    userSelect.innerHTML = `

        <option value="">
            Select User ID
        </option>

    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("login")
            .select(
                "id,name,mobile,balance"
            )
            .order(
                "id",
                {
                    ascending:true
                }
            );


        if(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            loading.innerText =
                "login table mein koi user nahi mila";

            return;

        }


        data.forEach(user => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                user.id;


            option.textContent =
                `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;


            userSelect.appendChild(
                option
            );

        });


        loading.innerText =
            "User ID select karein";


    }catch(error){

        console.error(error);


        loading.innerText =
            "Users load nahi ho rahe";


        showError(
            "Users load nahi ho rahe: " +
            (
                error.message ||
                error.details ||
                error.hint ||
                "Supabase error"
            )
        );

    }

}


/* =========================================================
   SET DEFAULT DATE
========================================================= */

function setDefaultDates(){

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth()+1
        ).padStart(2,"0");


    const day =
        String(
            today.getDate()
        ).padStart(2,"0");


    const todayValue =
        `${year}-${month}-${day}`;


    fromDate.value =
        todayValue;

    toDate.value =
        todayValue;

}


/* =========================================================
   GET USER
========================================================= */

async function getUser(userId){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("login")
        .select(
            "id,name,mobile,balance,wallet"
        )
        .eq(
            "id",
            userId
        )
        .maybeSingle();


    if(error){

        throw error;

    }


    return data;

}


/* =========================================================
   DATE RANGE
========================================================= */

function getDateRange(){

    const from =
        fromDate.value;

    const to =
        toDate.value;


    if(!from || !to){

        return null;

    }


    /*
       Tumhare existing game-day system ke hisab se:

       From = 05:00 AM

       To Date ka next day = 04:59:59 AM
    */

    const start =
        new Date(
            `${from}T05:00:00`
        );


    const end =
        new Date(
            `${to}T05:00:00`
        );


    end.setDate(
        end.getDate()+1
    );


    return {
        start,
        end
    };

}


/* =========================================================
   LOAD STATEMENT
========================================================= */

async function loadTransactions(){

    hideError();


    const userId =
        userSelect.value;


    const range =
        getDateRange();


    statementBody.innerHTML =
        "";

    statementTable.style.display =
        "none";


    if(!userId){

        loading.style.display =
            "block";

        loading.innerText =
            "Select User ID";

        return;

    }


    if(!range){

        loading.style.display =
            "block";

        loading.innerText =
            "From Date aur To Date select karein";

        return;

    }


    if(range.start >= range.end){

        loading.style.display =
            "block";

        loading.innerText =
            "From Date sahi select karein";

        return;

    }


    loading.style.display =
        "block";

    loading.innerText =
        "Statement loading...";


    try{

        /* =================================================
           CURRENT USER
        ================================================= */

        const user =
            await getUser(
                userId
            );


        if(!user){

            throw new Error(
                "Selected user login table mein nahi mila."
            );

        }


        /*
           IMPORTANT:

           Opening Balance =
           CURRENT login.balance

           Is balance ko alag se minus
           nahi karna.
        */

        const currentBalance =
            Number(
                user.balance || 0
            );


        openingBalance.textContent =
            money(currentBalance);


        /* =================================================
           TRANSACTIONS
        ================================================= */

        let transactions = [];


        /* =================================================
           HISTORY
        ================================================= */

        const historyRows =
            await getAllRows(
                "history",
                "*",
                "user_id",
                userId
            );


        historyRows.forEach(row => {

            if(!row.created_at){
                return;
            }


            const dt =
                new Date(
                    row.created_at
                );


            if(
                dt < range.start ||
                dt >= range.end
            ){

                return;

            }


            const amount =
                Number(
                    row.total ??
                    row.amount ??
                    row.bet_amount ??
                    0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                uniqueKey:
                    "history_" +
                    row.id,

                date:
                    row.created_at,

                particulars:
                    `${row.market || "Game"} Game / Bet`,

                debit:
                    amount,

                credit:
                    0

            });

        });


        /* =================================================
           WINING
        ================================================= */

        const winingRows =
            await getAllRows(
                "wining",
                "*",
                "user_id",
                userId
            );


        winingRows.forEach(row => {

            if(!row.created_at){
                return;
            }


            const dt =
                new Date(
                    row.created_at
                );


            if(
                dt < range.start ||
                dt >= range.end
            ){

                return;

            }


            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            if(
                status &&
                !ACCEPTED_STATUS.includes(
                    status
                )
            ){

                return;

            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                uniqueKey:
                    "wining_" +
                    row.id,

                date:
                    row.created_at,

                particulars:
                    `${row.market || "Game"} Winning`,

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =================================================
           WITHDRAW
        ================================================= */

        const withdrawRows =
            await getAllRows(
                "withdraw_requests",
                "*",
                "user_id",
                userId
            );


        withdrawRows.forEach(row => {

            if(!row.created_at){
                return;
            }


            const dt =
                new Date(
                    row.created_at
                );


            if(
                dt < range.start ||
                dt >= range.end
            ){

                return;

            }


            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            if(
                status &&
                !ACCEPTED_STATUS.includes(
                    status
                )
            ){

                return;

            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                uniqueKey:
                    "withdraw_" +
                    row.id,

                date:
                    row.created_at,

                particulars:
                    "Withdraw",

                debit:
                    amount,

                credit:
                    0

            });

        });


        /* =================================================
           DEPOSITS
        ================================================= */

        const depositRows =
            await getAllRows(
                "deposits",
                "*",
                "user_id",
                userId
            );


        depositRows.forEach(row => {

            if(!row.created_at){
                return;
            }


            const dt =
                new Date(
                    row.created_at
                );


            if(
                dt < range.start ||
                dt >= range.end
            ){

                return;

            }


            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            if(
                status &&
                !ACCEPTED_STATUS.includes(
                    status
                )
            ){

                return;

            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                uniqueKey:
                    "deposit_" +
                    row.id,

                date:
                    row.created_at,

                particulars:
                    "Deposit",

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =================================================
           DEPOSIT REQUESTS
        ================================================= */

        const depositRequestRows =
            await getAllRows(
                "deposit_requests",
                "*",
                "user_id",
                userId
            );


        depositRequestRows.forEach(row => {

            if(!row.created_at){
                return;
            }


            const dt =
                new Date(
                    row.created_at
                );


            if(
                dt < range.start ||
                dt >= range.end
            ){

                return;

            }


            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            if(
                !ACCEPTED_STATUS.includes(
                    status
                )
            ){

                return;

            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                uniqueKey:
                    "deposit_request_" +
                    row.id,

                date:
                    row.created_at,

                particulars:
                    "Deposit",

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =================================================
           ADMIN HISTORY
        ================================================= */

        const adminRows =
            await getAllRows(
                "admin_history",
                "*",
                "user_id",
                userId
            );


        adminRows.forEach(row => {

            if(!row.created_at){
                return;
            }


            const dt =
                new Date(
                    row.created_at
                );


            if(
                dt < range.start ||
                dt >= range.end
            ){

                return;

            }


            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            if(
                status &&
                !ACCEPTED_STATUS.includes(
                    status
                )
            ){

                return;

            }


            const amount =
                Number(
                    row.action_amount || 0
                );


            if(amount <= 0){
                return;
            }


            const action =
                String(
                    row.action_type || ""
                ).toLowerCase();


            if(
                action.includes("deposit") ||
                action.includes("credit") ||
                action.includes("add")
            ){

                transactions.push({

                    uniqueKey:
                        "admin_credit_" +
                        row.id,

                    date:
                        row.created_at,

                    particulars:
                        "Admin Credit",

                    debit:
                        0,

                    credit:
                        amount

                });

            }


            else if(
                action.includes("withdraw") ||
                action.includes("debit") ||
                action.includes("deduct") ||
                action.includes("minus")
            ){

                transactions.push({

                    uniqueKey:
                        "admin_debit_" +
                        row.id,

                    date:
                        row.created_at,

                    particulars:
                        "Admin Debit",

                    debit:
                        amount,

                    credit:
                        0

                });

            }

        });


        /* =================================================
           DUPLICATE REMOVE
        ================================================= */

        const uniqueMap =
            new Map();


        transactions.forEach(tx => {

            if(
                !uniqueMap.has(
                    tx.uniqueKey
                )
            ){

                uniqueMap.set(
                    tx.uniqueKey,
                    tx
                );

            }

        });


        transactions =
            Array.from(
                uniqueMap.values()
            );


        /* =================================================
           OLD TO NEW
        ================================================= */

        transactions.sort(
            (a,b) =>
                new Date(a.date) -
                new Date(b.date)
        );


        /* =================================================
           RUNNING BALANCE
        ================================================= */

        let runningBalance =
            currentBalance;


        let debitTotal =
            0;


        let creditTotal =
            0;


        /* =================================================
           NO TRANSACTION
        ================================================= */

        if(
            transactions.length === 0
        ){

            loading.style.display =
                "block";

            loading.innerText =
                "Is date range mein koi transaction nahi hai";


            totalDebit.textContent =
                money(0);


            totalCredit.textContent =
                money(0);


            closingBalance.textContent =
                money(runningBalance);


            return;

        }


        /* =================================================
           EACH ROW
        ================================================= */

        transactions.forEach(tx => {

            const debit =
                Number(
                    tx.debit || 0
                );


            const credit =
                Number(
                    tx.credit || 0
                );


            debitTotal +=
                debit;


            creditTotal +=
                credit;


            /*
               MAIN BALANCE LOGIC

               Debit  = MINUS
               Credit = PLUS

               Example:

               Opening ₹10

               Deposit ₹100
               = ₹110

               Deposit ₹100
               = ₹210

               Deposit ₹500
               = ₹710

               Debit ₹100
               = ₹610

               Debit ₹100
               = ₹510

               Debit ₹490
               = ₹20
            */

            runningBalance =
                runningBalance
                - debit
                + credit;


            const tr =
                document.createElement(
                    "tr"
                );


            if(credit > 0){

                tr.className =
                    "credit-row";

            }


            if(debit > 0){

                tr.className =
                    "debit-row";

            }


            tr.innerHTML = `

                <td>
                    ${formatDateTime(tx.date)}
                </td>

                <td>
                    ${escapeHTML(tx.particulars)}
                </td>

                <td>
                    ${
                        debit > 0
                        ? money(debit)
                        : ""
                    }
                </td>

                <td>
                    ${
                        credit > 0
                        ? money(credit)
                        : ""
                    }
                </td>

                <td>
                    ${money(runningBalance)}
                </td>

            `;


            statementBody.appendChild(
                tr
            );

        });


        /* =================================================
           TOTAL ROW
        ================================================= */

        const totalRow =
            document.createElement(
                "tr"
            );


        totalRow.className =
            "total-row";


        totalRow.innerHTML = `

            <td colspan="2">
                TOTAL
            </td>

            <td>
                ${money(debitTotal)}
            </td>

            <td>
                ${money(creditTotal)}
            </td>

            <td>
                ${money(runningBalance)}
            </td>

        `;


        statementBody.appendChild(
            totalRow
        );


        /* =================================================
           SUMMARY
        ================================================= */

        totalDebit.textContent =
            money(debitTotal);


        totalCredit.textContent =
            money(creditTotal);


        closingBalance.textContent =
            money(runningBalance);


        loading.style.display =
            "none";


        statementTable.style.display =
            "table";


    }catch(error){

        console.error(
            "STATEMENT ERROR:",
            error
        );


        loading.style.display =
            "block";


        loading.innerText =
            "Statement load nahi ho rahi";


        showError(
            error.message ||
            error.details ||
            "Supabase error"
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
