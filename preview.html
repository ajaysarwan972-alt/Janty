<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Bank Statement</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#111;
}

.container{
    width:96%;
    max-width:1200px;
    margin:20px auto;
    background:#fff;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    margin:0 0 20px;
}

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.filters select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.statement-info{
    margin-bottom:15px;
}

.opening{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

th,
td{
    border:1px solid #ccc;
    padding:10px 8px;
    text-align:center;
}

th{
    background:#222;
    color:#fff;
}

.debit{
    color:#c00000;
    font-weight:bold;
}

.credit{
    color:#008000;
    font-weight:bold;
}

.balance{
    font-weight:bold;
}

.total-row{
    font-weight:bold;
    background:#eee;
}

.summary{
    margin-top:18px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid #eee;
}

.summary-row:last-child{
    border-bottom:none;
}

.closing{
    font-size:19px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:bold;
}

.error{
    color:red;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<div class="container">

    <h2>USER BANK STATEMENT</h2>

    <div class="filters">

        <select id="userSelect">
            <option value="">Select User ID</option>
        </select>

        <select id="dateSelect">
            <option value="">Select Date</option>
        </select>

    </div>

    <div id="statement"></div>

</div>

<script>

const SUPABASE_URL =
    "https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
    "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   BASIC HELPERS
========================================================= */

function money(value){

    value = Number(value || 0);

    return "₹" + value.toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}


function numberValue(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;
}


function dateKey(date){

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2,"0");

    const d = String(
        date.getDate()
    ).padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function displayDate(date){

    const d = String(
        date.getDate()
    ).padStart(2,"0");

    const m = String(
        date.getMonth() + 1
    ).padStart(2,"0");

    const y = date.getFullYear();

    return `${d}/${m}/${y}`;
}


function formatDateTime(value){

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return "";
    }

    const dd = String(
        d.getDate()
    ).padStart(2,"0");

    const mm = String(
        d.getMonth()+1
    ).padStart(2,"0");

    const yyyy = d.getFullYear();

    const hh = String(
        d.getHours()
    ).padStart(2,"0");

    const mi = String(
        d.getMinutes()
    ).padStart(2,"0");

    const ss = String(
        d.getSeconds()
    ).padStart(2,"0");

    return `${dd}/${mm}/${yyyy} ${hh}:${mi}:${ss}`;
}


function isAccepted(status){

    if(status === null || status === undefined){
        return true;
    }

    return [
        "accepted",
        "accept",
        "approved",
        "approve",
        "success",
        "successful",
        "completed",
        "complete",
        "clear",
        "cleared"
    ].includes(
        String(status).toLowerCase()
    );
}


/* =========================================================
   USERS
========================================================= */

async function loadUsers(){

    const {data,error} =
        await supabaseClient
        .from("login")
        .select("id,name,mobile,balance")
        .order("id",{ascending:true});

    if(error){

        document.getElementById("statement").innerHTML =
            `<div class="error">${error.message}</div>`;

        return;
    }

    const select =
        document.getElementById("userSelect");

    select.innerHTML =
        `<option value="">Select User ID</option>`;

    (data || []).forEach(user => {

        const option =
            document.createElement("option");

        option.value = user.id;

        option.textContent =
            `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

        option.dataset.balance =
            numberValue(user.balance);

        select.appendChild(option);
    });
}


/* =========================================================
   DATE LIST
========================================================= */

function loadDates(){

    const select =
        document.getElementById("dateSelect");

    select.innerHTML =
        `<option value="">Select Date</option>`;

    const today =
        new Date();

    for(let i=0;i<30;i++){

        const d =
            new Date(today);

        d.setDate(
            today.getDate() - i
        );

        const value =
            dateKey(d);

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent =
            displayDate(d);

        select.appendChild(option);
    }
}


/* =========================================================
   GET ALL ROWS
========================================================= */

async function getAllRows(
    table,
    columns,
    filterColumn,
    userId
){

    let all = [];

    let from = 0;

    const step = 1000;

    while(true){

        let query =
            supabaseClient
            .from(table)
            .select(columns)
            .eq(filterColumn,userId)
            .range(from,from + step - 1);

        const {data,error} =
            await query;

        if(error){
            throw error;
        }

        if(!data || data.length === 0){
            break;
        }

        all =
            all.concat(data);

        if(data.length < step){
            break;
        }

        from += step;
    }

    return all;
}


/* =========================================================
   DATE RANGE
   05:00 AM TO NEXT DAY 04:59:59 AM
========================================================= */

function getStatementRange(dateString){

    const [y,m,d] =
        dateString
        .split("-")
        .map(Number);

    const start =
        new Date(
            y,
            m - 1,
            d,
            5,
            0,
            0,
            0
        );

    const end =
        new Date(
            y,
            m - 1,
            d + 1,
            4,
            59,
            59,
            999
        );

    return {
        start,
        end
    };
}


/* =========================================================
   LOAD TRANSACTIONS
========================================================= */

async function loadTransactions(
    userId,
    start,
    end
){

    const transactions = [];


    /* =====================================================
       HISTORY - GAME / BET
    ===================================================== */

    const history =
        await getAllRows(
            "history",
            "id,user_id,market,total,created_at,status,game_date",
            "user_id",
            userId
        );

    history.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(dt < start || dt > end){
            return;
        }

        if(
            row.status &&
            !isAccepted(row.status)
        ){
            return;
        }

        const amount =
            numberValue(row.total);

        if(amount <= 0){
            return;
        }

        transactions.push({

            id:
                `history-${row.id}`,

            time:
                dt,

            particulars:
                `${row.market || ""} - Game / Bet`,

            debit:
                amount,

            credit:
                0
        });
    });


    /* =====================================================
       WINING
    ===================================================== */

    const wining =
        await getAllRows(
            "wining",
            "id,user_id,market,amount,created_at,status,number,bet_amount,history_id,game_type",
            "user_id",
            userId
        );

    wining.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(dt < start || dt > end){
            return;
        }

        if(
            row.status &&
            !isAccepted(row.status)
        ){
            return;
        }

        const amount =
            numberValue(row.amount);

        if(amount <= 0){
            return;
        }

        transactions.push({

            id:
                `wining-${row.id}`,

            time:
                dt,

            particulars:
                `${row.market || ""} - Winning`,

            debit:
                0,

            credit:
                amount
        });
    });


    /* =====================================================
       WITHDRAW
    ===================================================== */

    const withdraws =
        await getAllRows(
            "withdraw_requests",
            "id,user_id,amount,status,created_at",
            "user_id",
            userId
        );

    withdraws.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(dt < start || dt > end){
            return;
        }

        if(
            !isAccepted(row.status)
        ){
            return;
        }

        const amount =
            numberValue(row.amount);

        if(amount <= 0){
            return;
        }

        transactions.push({

            id:
                `withdraw-${row.id}`,

            time:
                dt,

            particulars:
                "Withdraw",

            debit:
                amount,

            credit:
                0
        });
    });


    /* =====================================================
       DEPOSITS
    ===================================================== */

    const deposits =
        await getAllRows(
            "deposits",
            "id,user_id,amount,status,utr,created_at",
            "user_id",
            userId
        );

    deposits.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(dt < start || dt > end){
            return;
        }

        if(
            !isAccepted(row.status)
        ){
            return;
        }

        const amount =
            numberValue(row.amount);

        if(amount <= 0){
            return;
        }

        transactions.push({

            id:
                `deposit-${row.id}`,

            time:
                dt,

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount
        });
    });


    /* =====================================================
       DEPOSIT REQUESTS
    ===================================================== */

    const depositRequests =
        await getAllRows(
            "deposit_requests",
            "id,user_id,amount,status,utr,created_at",
            "user_id",
            userId
        );

    depositRequests.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(dt < start || dt > end){
            return;
        }

        if(
            !isAccepted(row.status)
        ){
            return;
        }

        const amount =
            numberValue(row.amount);

        if(amount <= 0){
            return;
        }

        transactions.push({

            id:
                `deposit-request-${row.id}`,

            time:
                dt,

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount
        });
    });


    /* =====================================================
       ADMIN HISTORY
    ===================================================== */

    const adminHistory =
        await getAllRows(
            "admin_history",
            "id,user_id,admin_user_id,action_type,action_amount,old_balance,new_balance,status,created_at",
            "user_id",
            userId
        );

    adminHistory.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(dt < start || dt > end){
            return;
        }

        if(
            row.status &&
            !isAccepted(row.status)
        ){
            return;
        }

        const oldBalance =
            numberValue(row.old_balance);

        const newBalance =
            numberValue(row.new_balance);

        const difference =
            newBalance - oldBalance;

        if(difference === 0){
            return;
        }

        /*
          Admin balance increase = CREDIT
          Admin balance decrease = DEBIT
        */

        transactions.push({

            id:
                `admin-${row.id}`,

            time:
                dt,

            particulars:
                row.action_type
                ? `Admin - ${row.action_type}`
                : "Admin Balance",

            debit:
                difference < 0
                ? Math.abs(difference)
                : 0,

            credit:
                difference > 0
                ? difference
                : 0
        });
    });


    /*
       Same timestamp par deterministic order
    */

    transactions.sort((a,b) => {

        const t =
            a.time.getTime() -
            b.time.getTime();

        if(t !== 0){
            return t;
        }

        return String(a.id)
            .localeCompare(String(b.id));
    });


    /*
       Duplicate exact source rows
    */

    const unique = [];

    const seen =
        new Set();

    transactions.forEach(row => {

        const key =
            [
                row.id,
                row.time.getTime(),
                row.particulars,
                row.debit,
                row.credit
            ].join("|");

        if(seen.has(key)){
            return;
        }

        seen.add(key);

        unique.push(row);
    });

    return unique;
}


/* =========================================================
   STATEMENT
========================================================= */

async function loadStatement(){

    const userId =
        document.getElementById(
            "userSelect"
        ).value;

    const dateString =
        document.getElementById(
            "dateSelect"
        ).value;

    const box =
        document.getElementById(
            "statement"
        );

    if(!userId || !dateString){

        box.innerHTML =
            `<div class="loading">
                Select User ID and Date
             </div>`;

        return;
    }

    box.innerHTML =
        `<div class="loading">
            Loading statement...
         </div>`;

    try{

        /*
           -------------------------------------------------
           CURRENT REAL WALLET BALANCE
           -------------------------------------------------
        */

        const {data:user,error:userError} =
            await supabaseClient
            .from("login")
            .select("id,name,mobile,balance")
            .eq("id",userId)
            .single();

        if(userError){
            throw userError;
        }

        /*
           THIS IS THE REAL CURRENT BALANCE
        */

        const currentWallet =
            numberValue(user.balance);


        const {start,end} =
            getStatementRange(
                dateString
            );


        /*
           GET TODAY'S TRANSACTIONS
        */

        const transactions =
            await loadTransactions(
                userId,
                start,
                end
            );


        /*
           -------------------------------------------------
           TOTALS
           -------------------------------------------------
        */

        let totalDebit = 0;

        let totalCredit = 0;

        transactions.forEach(row => {

            totalDebit +=
                numberValue(row.debit);

            totalCredit +=
                numberValue(row.credit);
        });


        /*
           -------------------------------------------------
           IMPORTANT:
           
           login.balance IS TODAY'S FINAL / CLOSING BALANCE.

           Opening is reverse-calculated:
           
           Opening =
           Closing + Total Debit - Total Credit
           
           Because:
           
           Closing =
           Opening - Debit + Credit
           -------------------------------------------------
        */

        let openingBalance =
            currentWallet +
            totalDebit -
            totalCredit;


        /*
           -------------------------------------------------
           NOW BUILD ROW BALANCES
           
           Debit = MINUS
           Credit = PLUS
           
           Every row gets its own updated balance.
           -------------------------------------------------
        */

        let runningBalance =
            openingBalance;

        transactions.forEach(row => {

            runningBalance =
                runningBalance -
                numberValue(row.debit) +
                numberValue(row.credit);

            row.balance =
                runningBalance;
        });


        /*
           -------------------------------------------------
           ROUNDING
        -------------------------------------------------
        */

        openingBalance =
            Math.round(
                openingBalance * 100
            ) / 100;

        runningBalance =
            Math.round(
                runningBalance * 100
            ) / 100;


        /*
           -------------------------------------------------
           CURRENT WALLET IS THE FINAL AUTHORITY
           
           This guarantees statement closing =
           login.balance
           -------------------------------------------------
        */

        const closingBalance =
            currentWallet;


        /*
           -------------------------------------------------
           TABLE
        -------------------------------------------------
        */

        let html = `

        <div class="statement-info">

            <div>
                <strong>User ID:</strong>
                ${user.id}
            </div>

            <div>
                <strong>Name:</strong>
                ${user.name || "-"}
            </div>

            <div>
                <strong>Mobile:</strong>
                ${user.mobile || "-"}
            </div>

            <div style="margin-top:10px;">
                <strong>Statement:</strong>
                ${displayDate(start)}
            </div>

            <div class="opening"
                 style="margin-top:12px;">
                Opening Balance:
                ${money(openingBalance)}
            </div>

        </div>

        <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>Date / Time</th>
                    <th>Particulars</th>
                    <th>Debit</th>
                    <th>Credit</th>
                    <th>Balance</th>
                </tr>

            </thead>

            <tbody>
        `;


        if(transactions.length === 0){

            html += `

                <tr>

                    <td colspan="5">

                        No transaction found

                    </td>

                </tr>

            `;

        }
        else{

            transactions.forEach(row => {

                html += `

                <tr>

                    <td>
                        ${formatDateTime(row.time)}
                    </td>

                    <td>
                        ${row.particulars}
                    </td>

                    <td class="debit">
                        ${
                            row.debit > 0
                            ? money(row.debit)
                            : "-"
                        }
                    </td>

                    <td class="credit">
                        ${
                            row.credit > 0
                            ? money(row.credit)
                            : "-"
                        }
                    </td>

                    <td class="balance">

                        ${money(row.balance)}

                    </td>

                </tr>

                `;

            });

        }


        html += `

                <tr class="total-row">

                    <td>
                        TOTAL
                    </td>

                    <td>
                        -
                    </td>

                    <td>
                        ${money(totalDebit)}
                    </td>

                    <td>
                        ${money(totalCredit)}
                    </td>

                    <td>
                        ${money(closingBalance)}
                    </td>

                </tr>

            </tbody>

        </table>

        </div>


        <div class="summary">

            <div class="summary-row">

                <span>
                    Opening Balance
                </span>

                <strong>
                    ${money(openingBalance)}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Total Debit
                </span>

                <strong class="debit">
                    ${money(totalDebit)}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Total Credit
                </span>

                <strong class="credit">
                    ${money(totalCredit)}
                </strong>

            </div>


            <div class="summary-row closing">

                <span>
                    Closing Balance
                </span>

                <strong>
                    ${money(closingBalance)}
                </strong>

            </div>

        </div>

        `;


        box.innerHTML =
            html;


    }
    catch(error){

        console.error(error);

        box.innerHTML = `

            <div class="error">

                Error:
                ${error.message}

            </div>

        `;

    }

}


/* =========================================================
   EVENTS
========================================================= */

document
.getElementById("userSelect")
.addEventListener(
    "change",
    loadStatement
);

document
.getElementById("dateSelect")
.addEventListener(
    "change",
    loadStatement
);


/* =========================================================
   INIT
========================================================= */

loadDates();

loadUsers();

</script>

</body>
</html>
