<script>


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";


/*
   YAHAN APNI WORKING PAGE WALI
   ANON / PUBLIC KEY LAGAO.

   Service Role Key MAT lagana.
*/

const SUPABASE_KEY =
"YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const userSelect =
document.getElementById("userSelect");

const fromDate =
document.getElementById("fromDate");

const toDate =
document.getElementById("toDate");

const statementBody =
document.getElementById("statementBody");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const userInfo =
document.getElementById("userInfo");

const infoId =
document.getElementById("infoId");

const infoName =
document.getElementById("infoName");

const infoMobile =
document.getElementById("infoMobile");

const presentBalance =
document.getElementById("presentBalance");

const summaryPresentBalance =
document.getElementById("summaryPresentBalance");

const totalDebit =
document.getElementById("totalDebit");

const totalCredit =
document.getElementById("totalCredit");


/* =========================================================
   MONEY
   ========================================================= */

function money(value){

    value = Number(value || 0);

    /*
       Negative sign display nahi karna
    */

    value = Math.abs(value);

    return "₹" +
        value.toLocaleString("en-IN",{
            minimumFractionDigits:0,
            maximumFractionDigits:2
        });
}


/* =========================================================
   DATE TIME
   ========================================================= */

function formatDateTime(value){

    if(!value){
        return "-";
    }

    const d =
        new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    const day =
        String(d.getDate())
        .padStart(2,"0");

    const month =
        String(d.getMonth()+1)
        .padStart(2,"0");

    const year =
        d.getFullYear();

    let hours =
        d.getHours();

    const minutes =
        String(d.getMinutes())
        .padStart(2,"0");

    const seconds =
        String(d.getSeconds())
        .padStart(2,"0");

    const ampm =
        hours >= 12
        ? "pm"
        : "am";

    hours =
        hours % 12;

    if(hours === 0){
        hours = 12;
    }

    return `
        ${day}/${month}/${year},
        ${String(hours).padStart(2,"0")}:${minutes}:${seconds} ${ampm}
    `;
}


/* =========================================================
   DATE
   ========================================================= */

function localDateString(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function setDefaultDates(){

    const today =
        new Date();

    const date =
        localDateString(today);

    fromDate.value =
        date;

    toDate.value =
        date;
}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message){

    errorBox.style.display =
        "block";

    errorBox.textContent =
        message;
}


function hideError(){

    errorBox.style.display =
        "none";

    errorBox.textContent =
        "";
}


/* =========================================================
   GET ALL ROWS
   ========================================================= */

async function getAllRows(
    table,
    columns
){

    let allRows = [];

    let start = 0;

    const pageSize = 1000;

    while(true){

        const {
            data,
            error
        } =
        await supabaseClient
        .from(table)
        .select(columns)
        .range(
            start,
            start + pageSize - 1
        );

        if(error){
            throw error;
        }

        if(data && data.length){

            allRows =
                allRows.concat(data);

        }

        if(
            !data ||
            data.length < pageSize
        ){

            break;

        }

        start +=
            pageSize;
    }

    return allRows;
}


/* =========================================================
   LOAD USERS
   ========================================================= */

async function loadUsers(){

    try{

        hideError();

        userSelect.innerHTML =
            `<option value="">
                Loading Users...
            </option>`;

        const {
            data,
            error
        } =
        await supabaseClient
        .from("login")
        .select(
            "id,name,mobile,balance"
        )
        .order(
            "id",
            {
                ascending:true
            }
        );

        if(error){
            throw error;
        }


        userSelect.innerHTML =
            `<option value="">
                Select User ID
            </option>`;


        if(!data || data.length === 0){

            userSelect.innerHTML =
                `<option value="">
                    No Users Found
                </option>`;

            return;
        }


        data.forEach(user => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                user.id;

            option.textContent =
                `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

            userSelect.appendChild(
                option
            );

        });


    }
    catch(error){

        console.error(error);

        userSelect.innerHTML =
            `<option value="">
                Users Load Failed
            </option>`;

        showError(
            "Users load nahi ho rahe: " +
            (error.message || error)
        );

    }

}


/* =========================================================
   GET USER
   ========================================================= */

async function getUser(userId){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("login")
    .select(
        "id,name,mobile,balance,wallet"
    )
    .eq(
        "id",
        userId
    )
    .maybeSingle();

    if(error){
        throw error;
    }

    return data;
}


/* =========================================================
   DATE RANGE
   05:00 AM TO NEXT DAY 05:00 AM
   ========================================================= */

function getDateRange(){

    const from =
        fromDate.value;

    const to =
        toDate.value;

    if(!from || !to){
        return null;
    }


    const start =
        new Date(
            `${from}T05:00:00`
        );


    const end =
        new Date(
            `${to}T05:00:00`
        );


    end.setDate(
        end.getDate() + 1
    );


    return {
        start,
        end
    };

}


/* =========================================================
   ACCEPTED STATUS
   ========================================================= */

function isAccepted(status){

    const s =
        String(
            status || ""
        ).toLowerCase()
        .trim();


    /*
       Agar status blank hai
       to bhi purana record allow.
    */

    if(!s){
        return true;
    }


    return [
        "accepted",
        "accept",
        "approved",
        "approve",
        "success",
        "successful",
        "completed",
        "complete",
        "clear",
        "cleared"
    ].includes(s);

}


/* =========================================================
   LOAD STATEMENT
   ========================================================= */

async function loadStatement(){

    hideError();


    const userId =
        userSelect.value;


    if(!userId){

        userInfo.style.display =
            "none";


        statementBody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty">
                    Select User ID
                </td>
            </tr>
        `;


        totalDebit.textContent =
            "₹0";

        totalCredit.textContent =
            "₹0";

        summaryPresentBalance.textContent =
            "₹0";

        return;
    }


    const range =
        getDateRange();


    if(!range){

        showError(
            "From Date aur To Date select karo."
        );

        return;
    }


    if(range.start > range.end){

        showError(
            "From Date galat hai."
        );

        return;
    }


    loading.style.display =
        "block";


    statementBody.innerHTML =
        "";


    try{


        /* =============================================
           USER
        ============================================= */

        const user =
            await getUser(userId);


        if(!user){

            throw new Error(
                "User nahi mila."
            );

        }


        /* =============================================
           USER INFO
        ============================================= */

        userInfo.style.display =
            "grid";


        infoId.textContent =
            user.id || "-";

        infoName.textContent =
            user.name || "-";

        infoMobile.textContent =
            user.mobile || "-";


        /*
           PRESENT BALANCE HAMESHA
           LOGIN.BALANCE SE AAYEGA.
        */

        const currentBalance =
            Number(
                user.balance || 0
            );


        presentBalance.textContent =
            money(currentBalance);


        summaryPresentBalance.textContent =
            money(currentBalance);


        /* =============================================
           GET TABLE DATA
        ============================================= */

        const [

            historyRows,

            winingRows,

            withdrawRows,

            depositsRows,

            depositRequestRows,

            adminHistoryRows

        ] = await Promise.all([


            getAllRows(
                "history",
                "id,user_id,market,total,amount,bet_amount,created_at,status,game_date"
            ),


            getAllRows(
                "wining",
                "id,user_id,market,amount,created_at,number,bet_amount,status,history_id,game_type"
            ),


            getAllRows(
                "withdraw_requests",
                "id,user_id,amount,status,created_at"
            ),


            getAllRows(
                "deposits",
                "id,user_id,amount,status,utr,created_at"
            ),


            getAllRows(
                "deposit_requests",
                "id,user_id,amount,utr,status,created_at"
            ),


            getAllRows(
                "admin_history",
                "id,user_id,admin_user_id,action_type,action_amount,old_balance,new_balance,status,created_at"
            )

        ]);


        /* =============================================
           TRANSACTIONS
        ============================================= */

        let transactions = [];


        /* =============================================
           HISTORY = DEBIT
        ============================================= */

        historyRows.forEach(row => {

            if(
                String(row.user_id)
                !==
                String(userId)
            ){
                return;
            }


            if(!row.created_at){
                return;
            }


            const date =
                new Date(
                    row.created_at
                );


            if(
                date < range.start ||
                date >= range.end
            ){
                return;
            }


            if(
                !isAccepted(row.status)
            ){
                return;
            }


            const amount =
                Number(
                    row.total ??
                    row.amount ??
                    row.bet_amount ??
                    0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                id:
                    row.id,

                created_at:
                    row.created_at,

                particulars:
                    `${row.market || "Game"} Game / Bet`,

                debit:
                    amount,

                credit:
                    0

            });

        });


        /* =============================================
           WINING = CREDIT
        ============================================= */

        winingRows.forEach(row => {

            if(
                String(row.user_id)
                !==
                String(userId)
            ){
                return;
            }


            if(!row.created_at){
                return;
            }


            const date =
                new Date(
                    row.created_at
                );


            if(
                date < range.start ||
                date >= range.end
            ){
                return;
            }


            if(
                !isAccepted(row.status)
            ){
                return;
            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                id:
                    row.id,

                created_at:
                    row.created_at,

                particulars:
                    `${row.market || "Game"} Winning`,

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =============================================
           WITHDRAW = DEBIT
        ============================================= */

        withdrawRows.forEach(row => {

            if(
                String(row.user_id)
                !==
                String(userId)
            ){
                return;
            }


            if(!row.created_at){
                return;
            }


            const date =
                new Date(
                    row.created_at
                );


            if(
                date < range.start ||
                date >= range.end
            ){
                return;
            }


            if(
                !isAccepted(row.status)
            ){
                return;
            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                id:
                    row.id,

                created_at:
                    row.created_at,

                particulars:
                    "Withdraw",

                debit:
                    amount,

                credit:
                    0

            });

        });


        /* =============================================
           DEPOSITS = CREDIT
        ============================================= */

        depositsRows.forEach(row => {

            if(
                String(row.user_id)
                !==
                String(userId)
            ){
                return;
            }


            if(!row.created_at){
                return;
            }


            const date =
                new Date(
                    row.created_at
                );


            if(
                date < range.start ||
                date >= range.end
            ){
                return;
            }


            if(
                !isAccepted(row.status)
            ){
                return;
            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                id:
                    row.id,

                created_at:
                    row.created_at,

                particulars:
                    "Deposit",

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =============================================
           DEPOSIT REQUESTS = CREDIT
        ============================================= */

        depositRequestRows.forEach(row => {

            if(
                String(row.user_id)
                !==
                String(userId)
            ){
                return;
            }


            if(!row.created_at){
                return;
            }


            const date =
                new Date(
                    row.created_at
                );


            if(
                date < range.start ||
                date >= range.end
            ){
                return;
            }


            if(
                !isAccepted(row.status)
            ){
                return;
            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){
                return;
            }


            transactions.push({

                id:
                    row.id,

                created_at:
                    row.created_at,

                particulars:
                    "Deposit",

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =============================================
           ADMIN HISTORY
        ============================================= */

        adminHistoryRows.forEach(row => {

            if(
                String(row.user_id)
                !==
                String(userId)
            ){
                return;
            }


            if(!row.created_at){
                return;
            }


            const date =
                new Date(
                    row.created_at
                );


            if(
                date < range.start ||
                date >= range.end
            ){
                return;
            }


            if(
                !isAccepted(row.status)
            ){
                return;
            }


            const type =
                String(
                    row.action_type || ""
                ).toLowerCase();


            const amount =
                Number(
                    row.action_amount || 0
                );


            if(amount <= 0){
                return;
            }


            let debit = 0;

            let credit = 0;


            if(
                type.includes("deposit") ||
                type.includes("credit") ||
                type.includes("add") ||
                type.includes("plus")
            ){

                credit =
                    amount;

            }
            else if(
                type.includes("withdraw") ||
                type.includes("debit") ||
                type.includes("deduct") ||
                type.includes("minus")
            ){

                debit =
                    amount;

            }
            else{

                return;

            }


            transactions.push({

                id:
                    row.id,

                created_at:
                    row.created_at,

                particulars:
                    row.action_type ||
                    "Admin Adjustment",

                debit:
                    debit,

                credit:
                    credit

            });

        });


        /* =============================================
           SORT OLD TO NEW
        ============================================= */

        transactions.sort(
            (a,b) => {

                const aTime =
                    new Date(
                        a.created_at
                    ).getTime();

                const bTime =
                    new Date(
                        b.created_at
                    ).getTime();


                if(
                    aTime !== bTime
                ){

                    return (
                        aTime -
                        bTime
                    );

                }


                return (
                    Number(a.id || 0)
                    -
                    Number(b.id || 0)
                );

            }
        );


        /* =============================================
           TOTALS
        ============================================= */

        let debitTotal = 0;

        let creditTotal = 0;


        transactions.forEach(row => {

            debitTotal +=
                Number(
                    row.debit || 0
                );

            creditTotal +=
                Number(
                    row.credit || 0
                );

        });


        totalDebit.textContent =
            money(debitTotal);


        totalCredit.textContent =
            money(creditTotal);


        /* =============================================
           NO DATA
        ============================================= */

        if(
            transactions.length === 0
        ){

            statementBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty">
                        Is date range mein
                        koi transaction nahi hai.
                    </td>
                </tr>
            `;

            return;

        }


        /* =================================================
           IMPORTANT LOGIC

           CURRENT LOGIN.BALANCE = PRESENT BALANCE

           Isko starting balance nahi banana.

           Pehle last transaction se reverse calculation
           karke har row ka balance nikala jayega.
        ================================================= */


        /*
           Current balance se start
        */

        let balanceAfter =
            currentBalance;


        /*
           Har transaction ke baad ka balance
           yahan store hoga.
        */

        const balances =
            new Array(
                transactions.length
            );


        /*
           NEW -> OLD reverse calculation
        */

        for(
            let i =
                transactions.length - 1;

            i >= 0;

            i--
        ){

            const row =
                transactions[i];


            /*
               Jo balance is transaction ke BAAD tha
               wo balanceAfter hai.
            */

            balances[i] =
                balanceAfter;


            const debit =
                Number(
                    row.debit || 0
                );

            const credit =
                Number(
                    row.credit || 0
                );


            /*
               Balance BEFORE transaction:

               Current/after balance
               + debit
               - credit
            */

            balanceAfter =
                balanceAfter
                + debit
                - credit;

        }


        /* =============================================
           CREATE TABLE
        ============================================= */

        let html = "";


        transactions.forEach(
            (row,index) => {

                const debit =
                    Number(
                        row.debit || 0
                    );


                const credit =
                    Number(
                        row.credit || 0
                    );


                const rowBalance =
                    balances[index];


                html += `

                    <tr>

                        <td>
                            ${formatDateTime(
                                row.created_at
                            )}
                        </td>


                        <td>
                            ${row.particulars}
                        </td>


                        <td class="debit">
                            ${
                                debit > 0
                                ? money(debit)
                                : ""
                            }
                        </td>


                        <td class="credit">
                            ${
                                credit > 0
                                ? money(credit)
                                : ""
                            }
                        </td>


                        <td class="balance">
                            ${money(rowBalance)}
                        </td>

                    </tr>

                `;

            }
        );


        statementBody.innerHTML =
            html;


    }
    catch(error){

        console.error(error);


        statementBody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty">
                    Data load nahi hua.
                </td>
            </tr>
        `;


        showError(
            "Statement load nahi hua: " +
            (error.message || error)
        );

    }
    finally{

        loading.style.display =
            "none";

    }

}

    loadStatement
);

    loadStatement

toDate.addEventListener(

    loadStatement
);

setDefaultDates();

loadUsers();

</script>
