<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>USER BANK STATEMENT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111;
}

.container{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    margin:5px 0 20px;
    font-size:26px;
}

.filters{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    margin-bottom:15px;
}

.filter-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.filter-box{
    flex:1;
    min-width:220px;
}

.filter-box label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
    background:white;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.info-box{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
    text-align:center;
}

.info-title{
    font-size:14px;
    color:#555;
    margin-bottom:6px;
}

.info-value{
    font-size:20px;
    font-weight:bold;
}

.opening{
    color:#0066cc;
}

.debit{
    color:#d00000;
}

.credit{
    color:#008000;
}

.closing{
    color:#111;
}

.table-box{
    width:100%;
    overflow-x:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

thead{
    background:#222;
    color:white;
}

th,
td{
    padding:10px 8px;
    border:1px solid #ddd;
    text-align:center;
    white-space:nowrap;
}

th{
    font-size:14px;
}

td{
    font-size:14px;
}

.credit-row{
    background:#f1fff1;
}

.debit-row{
    background:#fff5f5;
}

.total-row{
    background:#eee;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:bold;
}

.no-data{
    text-align:center;
    padding:20px;
    font-weight:bold;
    color:#777;
}

@media(max-width:700px){

    .container{
        padding:8px;
    }

    h1{
        font-size:21px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .filter-box{
        min-width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>USER BANK STATEMENT</h1>

    <!-- FILTERS -->

    <div class="filters">

        <div class="filter-row">

            <div class="filter-box">

                <label>User ID</label>

                <select id="userSelect">
                    <option value="">Select User ID</option>
                </select>

            </div>


            <div class="filter-box">

                <label>From Date</label>

                <select id="fromDateSelect">
                    <option value="">Select From Date</option>
                </select>

            </div>


            <div class="filter-box">

                <label>To Date</label>

                <select id="toDateSelect">
                    <option value="">Select To Date</option>
                </select>

            </div>

        </div>

    </div>


    <!-- SUMMARY -->

    <div class="info">

        <div class="info-box">

            <div class="info-title">
                Opening Balance
            </div>

            <div class="info-value opening" id="openingBalance">
                ₹0
            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                Total Debit
            </div>

            <div class="info-value debit" id="totalDebit">
                ₹0
            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                Total Credit
            </div>

            <div class="info-value credit" id="totalCredit">
                ₹0
            </div>

        </div>

    </div>


    <div class="info">

        <div class="info-box">

            <div class="info-title">
                Closing Balance
            </div>

            <div class="info-value closing" id="closingBalance">
                ₹0
            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-box">

        <div id="loading" class="loading">
            Select User ID
        </div>

        <table id="statementTable" style="display:none;">

            <thead>

                <tr>

                    <th>Date / Time</th>

                    <th>Particulars</th>

                    <th>Debit</th>

                    <th>Credit</th>

                    <th>Balance</th>

                </tr>

            </thead>

            <tbody id="statementBody">
            </tbody>

        </table>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";


const SUPABASE_KEY =
"YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const userSelect =
document.getElementById("userSelect");

const fromDateSelect =
document.getElementById("fromDateSelect");

const toDateSelect =
document.getElementById("toDateSelect");

const statementBody =
document.getElementById("statementBody");

const statementTable =
document.getElementById("statementTable");

const loading =
document.getElementById("loading");

const openingBalance =
document.getElementById("openingBalance");

const totalDebit =
document.getElementById("totalDebit");

const totalCredit =
document.getElementById("totalCredit");

const closingBalance =
document.getElementById("closingBalance");


/* =========================================================
   ACCEPTED STATUS
========================================================= */

const ACCEPTED_STATUS = [

    "accepted",
    "accept",
    "approved",
    "approve",
    "success",
    "successful",
    "completed",
    "complete",
    "clear",
    "cleared"

];


/* =========================================================
   FORMAT MONEY
========================================================= */

function money(value){

    value = Number(value || 0);

    /*
       User ke kehne ke according
       minus sign display nahi hoga.
    */

    value = Math.abs(value);

    return "₹" + value.toLocaleString("en-IN");

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDateTime(value){

    if(!value){
        return "";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString("en-IN",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    });

}


/* =========================================================
   DATE ONLY
========================================================= */

function dateOnly(value){

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return "";
    }

    const y =
        d.getFullYear();

    const m =
        String(d.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(d.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${day}`;

}


/* =========================================================
   GET ALL ROWS
========================================================= */

async function getAllRows(
    tableName,
    columns="*",
    filterColumn=null,
    filterValue=null
){

    let all = [];

    let from = 0;

    const step = 1000;

    while(true){

        let query =
            supabaseClient
            .from(tableName)
            .select(columns)
            .range(from,from+step-1);

        if(
            filterColumn !== null &&
            filterValue !== null
        ){

            query =
                query.eq(
                    filterColumn,
                    filterValue
                );

        }

        const {
            data,
            error
        } = await query;

        if(error){

            console.error(
                tableName,
                error
            );

            break;
        }

        if(!data || data.length === 0){
            break;
        }

        all =
            all.concat(data);

        if(data.length < step){
            break;
        }

        from += step;

    }

    return all;

}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsers(){

    userSelect.innerHTML =
        `<option value="">Select User ID</option>`;

    const {
        data,
        error
    } =
        await supabaseClient
        .from("login")
        .select("id,name,mobile,balance")
        .order("id",{ascending:true});

    if(error){

        console.error(error);

        loading.innerText =
            "Users load nahi ho rahe";

        return;

    }

    if(!data){
        return;
    }

    data.forEach(user => {

        const option =
            document.createElement("option");

        option.value =
            user.id;

        option.textContent =
            `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

        userSelect.appendChild(option);

    });

}


/* =========================================================
   LOAD DATES
========================================================= */

function loadDates(){

    fromDateSelect.innerHTML =
        `<option value="">Select From Date</option>`;

    toDateSelect.innerHTML =
        `<option value="">Select To Date</option>`;

    const today =
        new Date();

    /*
       Last 365 days
    */

    for(let i=364;i>=0;i--){

        const d =
            new Date(today);

        d.setDate(
            d.getDate()-i
        );

        const value =
            dateOnly(d);

        const display =
            d.toLocaleDateString(
                "en-IN",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric"
                }
            );


        const option1 =
            document.createElement("option");

        option1.value =
            value;

        option1.textContent =
            display;

        fromDateSelect.appendChild(
            option1
        );


        const option2 =
            document.createElement("option");

        option2.value =
            value;

        option2.textContent =
            display;

        toDateSelect.appendChild(
            option2
        );

    }


    /*
       Default dono today
    */

    const todayValue =
        dateOnly(today);

    fromDateSelect.value =
        todayValue;

    toDateSelect.value =
        todayValue;

}


/* =========================================================
   RESET TABLE
========================================================= */

function resetStatement(){

    statementBody.innerHTML = "";

    statementTable.style.display =
        "none";

    loading.style.display =
        "block";

    openingBalance.textContent =
        "₹0";

    totalDebit.textContent =
        "₹0";

    totalCredit.textContent =
        "₹0";

    closingBalance.textContent =
        "₹0";

}


/* =========================================================
   GET SELECTED USER
========================================================= */

async function getUser(userId){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("login")
        .select("id,name,mobile,balance,wallet")
        .eq("id",userId)
        .maybeSingle();

    if(error){

        console.error(
            "User error:",
            error
        );

        return null;

    }

    return data;

}


/* =========================================================
   GET DATE RANGE
========================================================= */

function getDateRange(){

    const from =
        fromDateSelect.value;

    const to =
        toDateSelect.value;

    if(!from || !to){
        return null;
    }


    /*
       Existing game-day system ko preserve
       karne ke liye:

       From date = 05:00 AM

       To date = next day 04:59:59 AM
    */

    const start =
        new Date(
            `${from}T05:00:00`
        );


    const end =
        new Date(
            `${to}T05:00:00`
        );

    end.setDate(
        end.getDate()+1
    );


    return {
        start,
        end
    };

}


/* =========================================================
   LOAD TRANSACTIONS
========================================================= */

async function loadTransactions(){

    const userId =
        userSelect.value;

    const range =
        getDateRange();


    if(!userId || !range){

        resetStatement();

        loading.innerText =
            "User ID aur Date select karein";

        return;

    }


    loading.style.display =
        "block";

    loading.innerText =
        "Loading...";

    statementTable.style.display =
        "none";

    statementBody.innerHTML =
        "";


    /* =====================================================
       CURRENT LOGIN BALANCE
    ===================================================== */

    const user =
        await getUser(userId);


    if(!user){

        loading.innerText =
            "User nahi mila";

        return;

    }


    /*
       IMPORTANT:

       Opening Balance = CURRENT login.balance

       Isko transaction calculation se
       alag se minus nahi karna.
    */

    const currentBalance =
        Number(user.balance || 0);


    openingBalance.textContent =
        money(currentBalance);


    /* =====================================================
       TRANSACTION ARRAY
    ===================================================== */

    let transactions = [];


    /* =====================================================
       HISTORY
    ===================================================== */

    const historyRows =
        await getAllRows(
            "history",
            "*",
            "user_id",
            userId
        );


    historyRows.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(
            dt < range.start ||
            dt >= range.end
        ){
            return;
        }


        const amount =
            Number(
                row.total ??
                row.amount ??
                row.bet_amount ??
                0
            );


        if(amount <= 0){
            return;
        }


        /*
           History = Debit
        */

        transactions.push({

            id:
                "history_"+row.id,

            date:
                row.created_at,

            particulars:
                `${row.market || "Game"} Game / Bet`,

            debit:
                amount,

            credit:
                0

        });

    });


    /* =====================================================
       WINING
    ===================================================== */

    const winingRows =
        await getAllRows(
            "wining",
            "*",
            "user_id",
            userId
        );


    winingRows.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(
            dt < range.start ||
            dt >= range.end
        ){
            return;
        }


        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            status &&
            !ACCEPTED_STATUS.includes(status)
        ){

            return;

        }


        const amount =
            Number(
                row.amount ??
                0
            );


        if(amount <= 0){
            return;
        }


        transactions.push({

            id:
                "wining_"+row.id,

            date:
                row.created_at,

            particulars:
                `${row.market || "Game"} Winning`,

            debit:
                0,

            credit:
                amount

        });

    });


    /* =====================================================
       WITHDRAW
    ===================================================== */

    const withdrawRows =
        await getAllRows(
            "withdraw_requests",
            "*",
            "user_id",
            userId
        );


    withdrawRows.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(
            dt < range.start ||
            dt >= range.end
        ){
            return;
        }


        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            status &&
            !ACCEPTED_STATUS.includes(status)
        ){

            return;

        }


        const amount =
            Number(
                row.amount || 0
            );


        if(amount <= 0){
            return;
        }


        transactions.push({

            id:
                "withdraw_"+row.id,

            date:
                row.created_at,

            particulars:
                "Withdraw",

            debit:
                amount,

            credit:
                0

        });

    });


    /* =====================================================
       DEPOSITS
    ===================================================== */

    const depositRows =
        await getAllRows(
            "deposits",
            "*",
            "user_id",
            userId
        );


    depositRows.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(
            dt < range.start ||
            dt >= range.end
        ){
            return;
        }


        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            status &&
            !ACCEPTED_STATUS.includes(status)
        ){

            return;

        }


        const amount =
            Number(
                row.amount || 0
            );


        if(amount <= 0){
            return;
        }


        transactions.push({

            id:
                "deposit_"+row.id,

            date:
                row.created_at,

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount

        });

    });


    /* =====================================================
       DEPOSIT REQUESTS
    ===================================================== */

    const depositRequestRows =
        await getAllRows(
            "deposit_requests",
            "*",
            "user_id",
            userId
        );


    depositRequestRows.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(
            dt < range.start ||
            dt >= range.end
        ){
            return;
        }


        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            !ACCEPTED_STATUS.includes(status)
        ){

            return;

        }


        const amount =
            Number(
                row.amount || 0
            );


        if(amount <= 0){
            return;
        }


        /*
           Agar deposits table mein
           same transaction aa gayi hai,
           duplicate hata denge.
        */

        transactions.push({

            id:
                "deposit_request_"+row.id,

            date:
                row.created_at,

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount

        });

    });


    /* =====================================================
       ADMIN HISTORY
    ===================================================== */

    const adminRows =
        await getAllRows(
            "admin_history",
            "*",
            "user_id",
            userId
        );


    adminRows.forEach(row => {

        if(!row.created_at){
            return;
        }

        const dt =
            new Date(row.created_at);

        if(
            dt < range.start ||
            dt >= range.end
        ){
            return;
        }


        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            status &&
            !ACCEPTED_STATUS.includes(status)
        ){

            return;

        }


        const amount =
            Number(
                row.action_amount || 0
            );


        if(amount <= 0){
            return;
        }


        const action =
            String(
                row.action_type || ""
            ).toLowerCase();


        /*
           Deposit / Credit
        */

        if(
            action.includes("deposit") ||
            action.includes("credit") ||
            action.includes("add")
        ){

            transactions.push({

                id:
                    "admin_credit_"+row.id,

                date:
                    row.created_at,

                particulars:
                    "Admin Credit",

                debit:
                    0,

                credit:
                    amount

            });

        }


        /*
           Withdraw / Debit
        */

        else if(
            action.includes("withdraw") ||
            action.includes("debit") ||
            action.includes("deduct") ||
            action.includes("minus")
        ){

            transactions.push({

                id:
                    "admin_debit_"+row.id,

                date:
                    row.created_at,

                particulars:
                    "Admin Debit",

                debit:
                    amount,

                credit:
                    0

            });

        }

    });


    /* =====================================================
       REMOVE DUPLICATE TRANSACTIONS
    ===================================================== */

    const unique =
        new Map();


    transactions.forEach(tx => {

        const key =
            tx.id;

        if(!unique.has(key)){

            unique.set(
                key,
                tx
            );

        }

    });


    transactions =
        Array.from(
            unique.values()
        );


    /* =====================================================
       SORT OLDEST FIRST
    ===================================================== */

    transactions.sort(
        (a,b) =>
            new Date(a.date) -
            new Date(b.date)
    );


    /* =====================================================
       CALCULATE
    ===================================================== */

    let runningBalance =
        currentBalance;

    let debitTotal = 0;

    let creditTotal = 0;


    statementBody.innerHTML =
        "";


    if(transactions.length === 0){

        loading.innerText =
            "Is date range mein koi transaction nahi hai";

        statementTable.style.display =
            "none";

        totalDebit.textContent =
            money(0);

        totalCredit.textContent =
            money(0);

        closingBalance.textContent =
            money(runningBalance);

        return;

    }


    /* =====================================================
       EACH TRANSACTION
    ===================================================== */

    transactions.forEach(tx => {

        const debit =
            Number(tx.debit || 0);

        const credit =
            Number(tx.credit || 0);


        debitTotal +=
            debit;

        creditTotal +=
            credit;


        /*
           MAIN LOGIC

           Debit  = MINUS
           Credit = PLUS

           Current balance ko dobara
           minus nahi karna.
        */

        runningBalance =
            runningBalance
            - debit
            + credit;


        /*
           User ne bola balance mein
           minus sign nahi chahiye.

           Isliye display positive.
        */

        const displayBalance =
            Math.abs(
                runningBalance
            );


        const tr =
            document.createElement("tr");


        if(credit > 0){
            tr.className =
                "credit-row";
        }

        if(debit > 0){
            tr.className =
                "debit-row";
        }


        tr.innerHTML = `

            <td>
                ${formatDateTime(tx.date)}
            </td>

            <td>
                ${escapeHTML(tx.particulars)}
            </td>

            <td>
                ${
                    debit > 0
                    ? money(debit)
                    : ""
                }
            </td>

            <td>
                ${
                    credit > 0
                    ? money(credit)
                    : ""
                }
            </td>

            <td>
                ${money(displayBalance)}
            </td>

        `;


        statementBody.appendChild(tr);

    });


    /* =====================================================
       TOTAL ROW
    ===================================================== */

    const totalTr =
        document.createElement("tr");

    totalTr.className =
        "total-row";


    totalTr.innerHTML = `

        <td colspan="2">
            TOTAL
        </td>

        <td>
            ${money(debitTotal)}
        </td>

        <td>
            ${money(creditTotal)}
        </td>

        <td>
            ${money(runningBalance)}
        </td>

    `;


    statementBody.appendChild(
        totalTr
    );


    /* =====================================================
       SUMMARY
    ===================================================== */

    totalDebit.textContent =
        money(debitTotal);

    totalCredit.textContent =
        money(creditTotal);


    closingBalance.textContent =
        money(runningBalance);


    loading.style.display =
        "none";

    statementTable.style.display =
        "table";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   EVENTS
========================================================= */

userSelect.addEventListener(
    "change",
    loadTransactions
);


fromDateSelect.addEventListener(
    "change",
    loadTransactions
);


toDateSelect.addEventListener(
    "change",
    loadTransactions
);


/* =========================================================
   START
========================================================= */

loadDates();
