<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const userSelect =
document.getElementById("userSelect");

const dateSelect =
document.getElementById("dateSelect");

const userDetails =
document.getElementById("userDetails");

const openingBox =
document.getElementById("openingBox");

const statementArea =
document.getElementById("statementArea");


let users = [];
let selectedUser = null;


/* =========================================================
   MONEY
========================================================= */

function money(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


/* =========================================================
   PAD
========================================================= */

function pad(n){

    return String(n).padStart(2,"0");

}


/* =========================================================
   DATE ONLY
========================================================= */

function formatDateOnly(date){

    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth()+1) +
        "-" +
        pad(date.getDate())
    );

}


/* =========================================================
   DISPLAY DATE
========================================================= */

function displayDate(date){

    const d =
        new Date(date);

    return (
        pad(d.getDate()) +
        "/" +
        pad(d.getMonth()+1) +
        "/" +
        d.getFullYear()
    );

}


/* =========================================================
   STATEMENT RANGE

   Statement:
   05:00 AM
   to
   NEXT DAY 04:59:59 AM
========================================================= */

function statementRange(dateString){

    const start =
        new Date(
            `${dateString}T05:00:00`
        );

    const end =
        new Date(start);

    end.setDate(
        end.getDate()+1
    );

    return {
        start,
        end
    };

}


/* =========================================================
   FORMAT DATETIME
========================================================= */

function formatDateTime(date){

    const d =
        new Date(date);

    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "-";

    }

    return (
        pad(d.getDate()) +
        "/" +
        pad(d.getMonth()+1) +
        "/" +
        d.getFullYear() +
        " " +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes()) +
        ":" +
        pad(d.getSeconds())
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   GET ALL ROWS
========================================================= */

async function getAllRows(
    table,
    select,
    filterFunction,
    pageSize = 1000
){

    let all = [];
    let from = 0;

    while(true){

        let query =
            supabaseClient
                .from(table)
                .select(select);

        query =
            filterFunction(query);

        const {
            data,
            error
        } =
        await query.range(
            from,
            from + pageSize - 1
        );

        if(error){

            console.error(
                "TABLE ERROR:",
                table,
                error
            );

            throw error;

        }

        if(
            data &&
            data.length
        ){

            all.push(
                ...data
            );

        }

        if(
            !data ||
            data.length < pageSize
        ){

            break;

        }

        from += pageSize;

    }

    return all;

}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsers(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("login")

            "id,name,mobile,balance"
        )

}


/* =========================================================
   LOAD DATES
========================================================= */

function loadDates(){

    dateSelect.innerHTML =
    `
        <option value="">
            Select Date
        </option>
    `;

    const today =
        new Date();

    for(
        let i = 0;
        i < 30;
        i++
    ){

        const d =
            new Date(today);

        d.setDate(
            today.getDate() - i
        );

        const option =
            document.createElement(
                "option"
            );

        option.value =
            formatDateOnly(d);

        option.textContent =
            displayDate(d);

        dateSelect.appendChild(
            option
        );

    }

}


/* =========================================================
   NORMALIZE NUMBER
========================================================= */

function num(value){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


/* =========================================================
   TRANSACTION DUPLICATE CHECK
=========================================================

   Same type
   Same amount
   5 seconds ke andar

   = duplicate
========================================================= */

function isDuplicateTransaction(
    transactions,
    type,
    amount,
    time
){

    const newTime =
        new Date(time).getTime();

    return transactions.some(
        t => {

            const oldTime =
                new Date(t.time).getTime();

            return (
                t.type === type &&
                Math.abs(
                    oldTime - newTime
                ) <= 5000 &&
                Math.abs(
                    num(t.amount) -
                    num(amount)
                ) < 0.00001
            );

        }
    );

}


/* =========================================================
   ADD TRANSACTION
========================================================= */

function addTransaction(
    transactions,
    {
        id,
        time,
        particulars,
        debit = 0,
        credit = 0,
        type,
        source
    }
){

    const d =
        num(debit);

    const c =
        num(credit);

    if(
        d <= 0 &&
        c <= 0
    ){

        return;

    }

    if(!time){

        return;

    }

    const amount =
        d > 0
        ? d
        : c;

    /*
       Important:

       Same transaction ko same type,
       same amount aur same time ke basis
       par dobara add nahi karenge.
    */

    if(
        isDuplicateTransaction(
            transactions,
            type,
            amount,
            time
        )
    ){

        return;

    }

    transactions.push({

        id:
            id ??
            `${source}-${time}-${amount}`,

        time:
            new Date(time),

        particulars:
            particulars || "Transaction",

        debit:
            d,

        credit:
            c,

        amount,

        type,

        source

    });

}


/* =========================================================
   GET LEDGER TRANSACTIONS

   Ye function current statement aur
   previous transactions dono ke liye
   same calculation use karta hai.
========================================================= */

async function getLedgerTransactions(
    userId,
    start,
    end
){

    const startISO =
        start.toISOString();

    const endISO =
        end.toISOString();

    const transactions = [];


    /* =====================================================
       1. HISTORY / GAME BET
       DEBIT
    ===================================================== */

    try{

        const historyRows =
            await getAllRows(
                "history",
                `
                    id,
                    user_id,
                    market,
                    total,
                    created_at,
                    status,
                    game_date
                `,
                query =>
                    query
                        .eq(
                            "user_id",
                            String(userId)
                        )
                        .gte(
                            "created_at",
                            startISO
                        )
                        .lt(
                            "created_at",
                            endISO
                        )
                        .order(
                            "created_at",
                            {
                                ascending:true
                            }
                        )
            );

        historyRows.forEach(
            row => {

                const amount =
                    num(row.total);

                if(amount <= 0){
                    return;
                }

                addTransaction(
                    transactions,
                    {
                        id:
                            `history-${row.id}`,

                        time:
                            row.created_at,

                        particulars:
                            `${row.market || "Game"} - Game / Bet`,

                        debit:
                            amount,

                        credit:
                            0,

                        type:
                            "debit-game",

                        source:
                            "history"
                    }
                );

            }
        );

    }catch(error){

        console.error(
            "History error:",
            error
        );

    }


    /* =====================================================
       2. ACCEPTED DEPOSITS
       CREDIT

       deposits ko primary source maana gaya hai.
    ===================================================== */

    try{

        const depositRows =
            await getAllRows(
                "deposits",
                `
                    id,
                    user_id,
                    amount,
                    status,
                    utr,
                    created_at
                `,
                query =>
                    query
                        .eq(
                            "user_id",
                            Number(userId)
                        )
                        .gte(
                            "created_at",
                            startISO
                        )
                        .lt(
                            "created_at",
                            endISO
                        )
                        .order(
                            "created_at",
                            {
                                ascending:true
                            }
                        )
            );

        depositRows.forEach(
            row => {

                const status =
                    String(
                        row.status || ""
                    ).toLowerCase();

                const allowed =
                    [
                        "accepted",
                        "accept",
                        "approved",
                        "approve",
                        "success",
                        "successful",
                        "completed",
                        "complete",
                        "clear",
                        "cleared"
                    ].includes(status);

                if(!allowed){
                    return;
                }

                const amount =
                    num(row.amount);

                if(amount <= 0){
                    return;
                }

                addTransaction(
                    transactions,
                    {
                        id:
                            `deposit-${row.id}`,

                        time:
                            row.created_at,

                        particulars:
                            row.utr
                            ? `Deposit - UTR ${row.utr}`
                            : "Deposit",

                        debit:
                            0,

                        credit:
                            amount,

                        type:
                            "credit-deposit",

                        source:
                            "deposits"
                    }
                );

            }
        );

    }catch(error){

        console.error(
            "Deposits error:",
            error
        );

    }


    /* =====================================================
       3. DEPOSIT REQUESTS

       Sirf tab add honge jab same accepted
       deposit already maujood na ho.
    ===================================================== */

    try{

        const requestRows =
            await getAllRows(
                "deposit_requests",
                `
                    id,
                    user_id,
                    amount,
                    utr,
                    status,
                    created_at
                `,
                query =>
                    query
                        .eq(
                            "user_id",
                            Number(userId)
                        )
                        .gte(
                            "created_at",
                            startISO
                        )
                        .lt(
                            "created_at",
                            endISO
                        )
                        .order(
                            "created_at",
                            {
                                ascending:true
                            }
                        )
            );

        requestRows.forEach(
            row => {

                const status =
                    String(
                        row.status || ""
                    ).toLowerCase();

                const allowed =
                    [
                        "accepted",
                        "accept",
                        "approved",
                        "approve",
                        "success",
                        "successful",
                        "completed",
                        "complete",
                        "clear",
                        "cleared"
                    ].includes(status);

                if(!allowed){
                    return;
                }

                const amount =
                    num(row.amount);

                if(amount <= 0){
                    return;
                }

                /*
                   Agar deposits table mein same amount/time
                   ya same UTR already hai to request ko
                   dobara count nahi karenge.
                */

                const requestTime =
                    new Date(
                        row.created_at
                    ).getTime();

                const duplicate =
                    transactions.some(
                        t => {

                            if(
                                t.type !==
                                "credit-deposit"
                            ){
                                return false;
                            }

                            const timeDiff =
                                Math.abs(
                                    new Date(
                                        t.time
                                    ).getTime()
                                    -
                                    requestTime
                                );

                            if(
                                row.utr &&
                                String(
                                    t.particulars
                                ).includes(
                                    String(row.utr)
                                )
                            ){

                                return true;

                            }

                            return (
                                Math.abs(
                                    num(t.credit) -
                                    amount
                                ) < 0.00001 &&
                                timeDiff <=
                                5 * 60 * 1000
                            );

                        }
                    );

                if(duplicate){
                    return;
                }

                addTransaction(
                    transactions,
                    {
                        id:
                            `deposit-request-${row.id}`,

                        time:
                            row.created_at,

                        particulars:
                            row.utr
                            ? `Deposit - UTR ${row.utr}`
                            : "Deposit",

                        debit:
                            0,

                        credit:
                            amount,

                        type:
                            "credit-deposit",

                        source:
                            "deposit_requests"
                    }
                );

            }
        );

    }catch(error){

        console.error(
            "Deposit request error:",
            error
        );

    }


    /* =====================================================
       4. WINING
       CREDIT
    ===================================================== */

    try{

        const winningRows =
            await getAllRows(
                "wining",
                `
                    id,
                    user_id,
                    market,
                    amount,
                    created_at,
                    status,
                    history_id,
                    number,
                    bet_amount,
                    game_type
                `,
                query =>
                    query
                        .eq(
                            "user_id",
                            String(userId)
                        )
                        .gte(
                            "created_at",
                            startISO
                        )
                        .lt(
                            "created_at",
                            endISO
                        )
                        .order(
                            "created_at",
                            {
                                ascending:true
                            }
                        )
            );

        winningRows.forEach(
            row => {

                const status =
                    String(
                        row.status || ""
                    ).toLowerCase();

                /*
                   Sirf accepted winning.
                */

                if(
                    status !== "accepted" &&
                    status !== "accept" &&
                    status !== "approved" &&
                    status !== "approve" &&
                    status !== "success" &&
                    status !== "successful" &&
                    status !== "completed" &&
                    status !== "complete" &&
                    status !== "clear" &&
                    status !== "cleared"
                ){

                    return;

                }

                const amount =
                    num(row.amount);

                if(amount <= 0){
                    return;
                }

                addTransaction(
                    transactions,
                    {
                        id:
                            `wining-${row.id}`,

                        time:
                            row.created_at,

                        particulars:
                            `${row.market || "Game"} - Winning`,

                        debit:
                            0,

                        credit:
                            amount,

                        type:
                            "credit-winning",

                        source:
                            "wining"
                    }
                );

            }
        );

    }catch(error){

        console.error(
            "Wining error:",
            error
        );

    }


    /* =====================================================
       5. WITHDRAW
       DEBIT

       Accepted / clear withdrawal hi actual
       bank statement mein debit hoga.
    ===================================================== */

    try{

        const withdrawRows =
            await getAllRows(
                "withdraw_requests",
                `
                    id,
                    user_id,
                    amount,
                    status,
                    created_at
                `,
                query =>
                    query
                        .eq(
                            "user_id",
                            Number(userId)
                        )
                        .gte(
                            "created_at",
                            startISO
                        )
                        .lt(
                            "created_at",
                            endISO
                        )
                        .order(
                            "created_at",
                            {
                                ascending:true
                            }
                        )
            );

        withdrawRows.forEach(
            row => {

                const status =
                    String(
                        row.status || ""
                    ).toLowerCase();

                const allowed =
                    [
                        "accepted",
                        "accept",
                        "approved",
                        "approve",
                        "success",
                        "successful",
                        "completed",
                        "complete",
                        "clear",
                        "cleared"
                    ].includes(status);

                if(!allowed){
                    return;
                }

                const amount =
                    num(row.amount);

                if(amount <= 0){
                    return;
                }

                addTransaction(
                    transactions,
                    {
                        id:
                            `withdraw-${row.id}`,

                        time:
                            row.created_at,

                        particulars:
                            "Withdraw",

                        debit:
                            amount,

                        credit:
                            0,

                        type:
                            "debit-withdraw",

                        source:
                            "withdraw_requests"
                    }
                );

            }
        );

    }catch(error){

        console.error(
            "Withdraw error:",
            error
        );

    }


    /* =====================================================
       6. ADMIN HISTORY

       Manual balance adjustment.

       Existing transaction ke same amount/time
       hone par duplicate nahi banega.
    ===================================================== */

    try{

        const adminRows =
            await getAllRows(
                "admin_history",
                `
                    id,
                    user_id,
                    admin_user_id,
                    action_type,
                    action_amount,
                    old_balance,
                    new_balance,
                    status,
                    created_at
                `,
                query =>
                    query
                        .eq(
                            "user_id",
                            Number(userId)
                        )
                        .gte(
                            "created_at",
                            startISO
                        )
                        .lt(
                            "created_at",
                            endISO
                        )
                        .order(
                            "created_at",
                            {
                                ascending:true
                            }
                        )
            );

        adminRows.forEach(
            row => {

                const oldBalance =
                    num(row.old_balance);

                const newBalance =
                    num(row.new_balance);

                let debit = 0;
                let credit = 0;

                /*
                   Agar old/new balance available hai,
                   difference actual transaction maana jayega.
                */

                if(
                    row.old_balance !== null &&
                    row.old_balance !== undefined &&
                    row.new_balance !== null &&
                    row.new_balance !== undefined
                ){

                    const difference =
                        newBalance -
                        oldBalance;

                    if(difference > 0){

                        credit =
                            difference;

                    }

                    if(difference < 0){

                        debit =
                            Math.abs(
                                difference
                            );

                    }

                }


                /*
                   Agar old/new se amount nahi mila,
                   action_amount use karo.
                */

                if(
                    debit === 0 &&
                    credit === 0
                ){

                    const amount =
                        num(
                            row.action_amount
                        );

                    const type =
                        String(
                            row.action_type || ""
                        ).toLowerCase();

                    if(amount > 0){

                        if(
                            type.includes("withdraw") ||
                            type.includes("debit") ||
                            type.includes("remove") ||
                            type.includes("minus")
                        ){

                            debit =
                                amount;

                        }else{

                            credit =
                                amount;

                        }

                    }

                }

                if(
                    debit === 0 &&
                    credit === 0
                ){

                    return;

                }


                let particulars =
                    row.action_type ||
                    "Wallet Transaction";

                const text =
                    String(
                        particulars
                    ).toLowerCase();


                if(
                    text.includes("withdraw") ||
                    text.includes("debit") ||
                    text.includes("remove") ||
                    text.includes("minus")
                ){

                    particulars =
                        "Withdraw";

                }else if(
                    text.includes("deposit") ||
                    text.includes("add") ||
                    text.includes("credit") ||
                    text.includes("plus")
                ){

                    particulars =
                        "Deposit";

                }


                const type =
                    debit > 0
                    ? "debit-admin"
                    : "credit-admin";

                const amount =
                    debit > 0
                    ? debit
                    : credit;


                /*
                   IMPORTANT:

                   Admin history agar kisi existing
                   deposit/withdraw ke saath same transaction
                   hai to duplicate nahi hoga.
                */

                if(
                    isDuplicateTransaction(
                        transactions,
                        type,
                        amount,
                        row.created_at
                    )
                ){

                    return;

                }


                /*
                   Cross-source duplicate check.

                   Admin Deposit / Withdraw aur actual
                   Deposit / Withdraw same time+amount
                   ho to bhi dobara count nahi hoga.
                */

                const adminDuplicate =
                    transactions.some(
                        t => {

                            const sameAmount =
                                Math.abs(
                                    num(t.amount) -
                                    amount
                                ) < 0.00001;

                            const sameTime =
                                Math.abs(
                                    new Date(
                                        t.time
                                    ).getTime()
                                    -
                                    new Date(
                                        row.created_at
                                    ).getTime()
                                ) <=
                                5000;

                            if(
                                !sameAmount ||
                                !sameTime
                            ){

                                return false;

                            }

                            if(
                                debit > 0 &&
                                t.debit > 0
                            ){

                                return true;

                            }

                            if(
                                credit > 0 &&
                                t.credit > 0
                            ){

                                return true;

                            }

                            return false;

                        }
                    );

                if(adminDuplicate){

                    return;

                }


                transactions.push({

                    id:
                        `admin-${row.id}`,

                    time:
                        new Date(
                            row.created_at
                        ),

                    particulars,

                    debit,

                    credit,

                    amount,

                    type,

                    source:
                        "admin_history"

                });

            }
        );

    }catch(error){

        /*
           admin_history table unavailable ho
           to statement baaki tables se chalega.
        */

        console.log(
            "Admin history unavailable:",
            error
        );

    }


    /* =====================================================
       FINAL SORT
    ===================================================== */

    transactions.sort(
        (a,b) =>
            new Date(a.time).getTime()
            -
            new Date(b.time).getTime()
    );


    return transactions;

}

                <div class="empty">
                    User ID और Statement Date select करें
                </div>
            `;

            return;

        }


        document.getElementById(
            "detailId"
        ).textContent =
            selectedUser.id;


        document.getElementById(
            "detailName"
        ).textContent =

/* =========================================================
   LOAD STATEMENT
========================================================= */

async function loadStatement(){

    if(
        !userSelect.value ||
        !dateSelect.value
    ){

        return;

    }


    statementArea.innerHTML =
    `
        <div class="loading">
            Loading statement...
        </div>
    `;


    openingBox.style.display =
        "none";


    try{

        const userId =
            userSelect.value;

        const selectedDate =
            dateSelect.value;


        const range =
            statementRange(
                selectedDate
            );

        const start =
            range.start;

        const end =
            range.end;


        /* =================================================
           CURRENT DAY TRANSACTIONS
        ================================================= */

        const currentTransactions =
            await getLedgerTransactions(
                userId,
                start,
                end
            );


        /* =================================================
           PREVIOUS TRANSACTIONS

           Start se pehle ka poora ledger.
           Isi se exact opening balance niklega.
        ================================================= */

        const beginning =
            new Date(
                "2000-01-01T00:00:00"
            );


        const previousTransactions =
            await getLedgerTransactions(
                userId,
                beginning,
                start
            );


        /* =================================================
           EXACT OPENING BALANCE

           Sab previous credits
           -
           Sab previous debits
        ================================================= */

        let openingBalance = 0;


        previousTransactions.forEach(
            t => {

                openingBalance +=
                    num(t.credit);

                openingBalance -=
                    num(t.debit);

            }
        );


        /*
           Floating point correction
        */

        if(
            Math.abs(
                openingBalance
            ) < 0.00001
        ){

            openingBalance = 0;

        }


        openingBox.style.display =
            "flex";


        document.getElementById(
            "openingBalance"
        ).textContent =
            `₹${money(openingBalance)}`;


        /* =================================================
           NO CURRENT TRANSACTIONS

           Opening balance phir bhi dikhega.
        ================================================= */

        if(
            currentTransactions.length === 0
        ){

            statementArea.innerHTML =
            `
                <div class="empty">
                    Is date par koi transaction nahi mila.
                </div>

                <div class="summary">

                    <div class="summary-row">

                        <div class="summary-title">
                            Opening Balance
                        </div>

                        <div class="summary-value">
                            ₹${money(openingBalance)}
                        </div>

                    </div>

                    <div class="summary-row">

                        <div class="summary-title">
                            Total Debit
                        </div>

                        <div class="summary-value">
                            ₹0.00
                        </div>

                    </div>

                    <div class="summary-row">

                        <div class="summary-title">
                            Total Credit
                        </div>

                        <div class="summary-value">
                            ₹0.00
                        </div>

                    </div>

                    <div class="summary-row">

                        <div class="summary-title">
                            Closing Balance
                        </div>

                        <div class="summary-value">
                            ₹${money(openingBalance)}
                        </div>

                    </div>

                </div>
            `;

            return;

        }


        /* =================================================
           RUNNING BALANCE
        ================================================= */

        let runningBalance =
            openingBalance;


        let totalDebit =
            0;

        let totalCredit =
            0;


        let rowsHTML =
            "";


        currentTransactions.forEach(
            t => {

                const debit =
                    num(t.debit);

                const credit =
                    num(t.credit);


                totalDebit +=
                    debit;

                totalCredit +=
                    credit;


                /*
                   Running balance
                */

                runningBalance =
                    runningBalance
                    -
                    debit
                    +
                    credit;


                if(
                    Math.abs(
                        runningBalance
                    ) < 0.00001
                ){

                    runningBalance = 0;

                }


                rowsHTML +=
                `
                    <tr>

                        <td class="date-col">
                            ${formatDateTime(t.time)}
                        </td>

                        <td class="particular">
                            ${escapeHTML(t.particulars)}
                        </td>

                        <td class="money debit">

                            ${
                                debit > 0
                                ? "₹" + money(debit)
                                : "-"
                            }

                        </td>

                        <td class="money credit">

                            ${
                                credit > 0
                                ? "₹" + money(credit)
                                : "-"
                            }

                        </td>

                        <td class="balance">

                            ₹${money(runningBalance)}

                        </td>

                    </tr>
                `;

            }
        );


        /* =================================================
           CLOSING BALANCE

           EXACT SAME RUNNING BALANCE
        ================================================= */

        const closingBalance =
            runningBalance;


        /* =================================================
           FINAL STATEMENT
        ================================================= */

        statementArea.innerHTML =
        `

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Date / Time
                            </th>

                            <th>
                                Particulars
                            </th>

                            <th>
                                Debit
                            </th>

                            <th>
                                Credit
                            </th>

                            <th>
                                Balance
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${rowsHTML}

                    </tbody>


                    <tfoot>

                        <tr>

                            <td
                                colspan="2"
                                class="total-label"
                            >
                                TOTAL
                            </td>

                            <td class="money debit">

                                ₹${money(totalDebit)}

                            </td>

                            <td class="money credit">

                                ₹${money(totalCredit)}

                            </td>

                            <td class="balance">

                                ₹${money(closingBalance)}

                            </td>

                        </tr>

                    </tfoot>

                </table>

            </div>


            <div class="summary">

                <div class="summary-row">

                    <div class="summary-title">
                        Opening Balance
                    </div>

                    <div class="summary-value">
                        ₹${money(openingBalance)}
                    </div>

                </div>


                <div class="summary-row">

                    <div class="summary-title">
                        Total Debit
                    </div>

                    <div class="summary-value">
                        ₹${money(totalDebit)}
                    </div>

                </div>


                <div class="summary-row">

                    <div class="summary-title">
                        Total Credit
                    </div>

                    <div class="summary-value">
                        ₹${money(totalCredit)}
                    </div>

                </div>


                <div class="summary-row">

                    <div class="summary-title">
                        Closing Balance
                    </div>

                    <div class="summary-value">
                        ₹${money(closingBalance)}
                    </div>

                </div>

            </div>

        `;


    }catch(error){

        console.error(
            "STATEMENT ERROR:",
            error
        );


        statementArea.innerHTML =
        `
            <div class="error">

                Statement load karte waqt error aaya.

                <br><br>

                ${escapeHTML(
                    error?.message ||
                    "Unknown error"
                )}

            </div>
        `;

    }

}
