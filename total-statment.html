/* =========================
   MONEY
========================= */

function money(value){

    value = Number(value || 0);

    return value.toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


/* =========================
   DATE HELPERS
========================= */

function pad(n){

    return String(n).padStart(2,"0");

}


function formatDateOnly(date){

    const y = date.getFullYear();

    const m = pad(date.getMonth()+1);

    const d = pad(date.getDate());

    return `${y}-${m}-${d}`;

}


function displayDate(date){

    const d = new Date(date);

    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;

}


/*
   Statement day:

   05:00 AM
   ->
   next day 04:59:59 AM
*/


function statementRange(dateString){

    const start =
        new Date(
            `${dateString}T05:00:00`
        );

    const end =
        new Date(start.getTime());

    end.setDate(end.getDate()+1);

    return {
        start,
        end
    };

}


/* =========================
   LOCAL TIMESTAMP
   For timestamp without timezone
========================= */

function localDateTimeString(date){

    return `${date.getFullYear()}-` +
           `${pad(date.getMonth()+1)}-` +
           `${pad(date.getDate())} ` +
           `${pad(date.getHours())}:` +
           `${pad(date.getMinutes())}:` +
           `${pad(date.getSeconds())}`;

}


/* =========================
   GET ALL ROWS
========================= */

async function getAllRows(
    table,
    select,
    filterFunction,
    pageSize = 1000
){

    let all = [];
    let from = 0;

    while(true){

        let query =
            supabaseClient
                .from(table)
                .select(select);

        query =
            filterFunction(query);

        const {
            data,
            error
        } = await query
            .range(
                from,
                from + pageSize - 1
            );

        if(error){

            console.log(
                table,
                error
            );

            break;
        }

        if(data && data.length){

            all.push(...data);
        }

        if(!data ||
           data.length < pageSize){

            break;
        }

        from += pageSize;
    }

    return all;

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("login")
        .select(
            "id,name,mobile,balance"
        )
        .order(
            "id",
            {ascending:true}
        );

    if(error){

        console.error(error);

        alert(
            "User list load nahi hui."
        );

        return;
    }

    users = data || [];

    userSelect.innerHTML =
        `<option value="">
            Select User ID
        </option>`;

    users.forEach(user => {

        const option =
            document.createElement("option");

        option.value = user.id;

        option.textContent =
            `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

        userSelect.appendChild(option);

    });

}


/* =========================
   LOAD DATES
========================= */

function loadDates(){

    dateSelect.innerHTML =
        `<option value="">
            Select Date
        </option>`;

    const today =
        new Date();

    /*
       30 days
    */

    for(let i=0;i<30;i++){

        const d =
            new Date(today);

        d.setDate(
            today.getDate()-i
        );

        const value =
            formatDateOnly(d);

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent =
            displayDate(d);

        dateSelect.appendChild(
            option
        );

    }

}


/* =========================
   USER CHANGE
========================= */

userSelect.addEventListener(
    "change",
    async function(){

        const id =
            this.value;

        selectedUser =
            users.find(
                u =>
                String(u.id) ===
                String(id)
            );

        if(!selectedUser){

            statementArea.innerHTML =

                    User ID और Statement Date select करें

            "detailId"
        ).textContent =

);

dateSelect.addEventListener(

/* =========================
   LOAD STATEMENT
========================= */

async function loadStatement(){

    if(
        !userSelect.value ||
        !dateSelect.value
    ){

        return;
    }

    statementArea.innerHTML =
        `<div class="loading">
            Loading statement...
        </div>`;

    const userId =
        userSelect.value;

    const selectedDate =
        dateSelect.value;

    const range =
        statementRange(
            selectedDate
        );

    const start =
        range.start;

    const end =
        range.end;

    /*
       For timestamptz tables
    */

    const startISO =
        start.toISOString();

    const endISO =
        end.toISOString();

    /*
       For timestamp without timezone
    */

    const startLocal =
        localDateTimeString(start);

    const endLocal =
        localDateTimeString(end);


    let transactions = [];


    /* =====================================
       1. HISTORY - GAME + HISTORY WINNING
    ===================================== */

    const historyRows =
        await getAllRows(
            "history",
            `
            id,
            user_id,
            market,
            data,
            total,
            created_at,
            status,
            win_amount,
            typing,
            commission,
            mode,
            action_type,
            action_amount,
            game_date
            `,
            query =>
                query
                .eq(
                    "user_id",
                    String(userId)
                )
                .gte(
                    "game_date",
                    selectedDate
                )
                .lt(
                    "game_date",
                    formatDateOnly(
                        end
                    )
                )
                .order(
                    "created_at",
                    {ascending:true}
                )
        );


    historyRows.forEach(row => {

        const amount =
            Number(row.total || 0);

        if(amount > 0){

            transactions.push({

                time:
                    new Date(
                        row.created_at
                    ),

                particulars:
                    `${row.market || "Game"} - Game / Bet`,

                debit:
                    amount,

                credit:
                    0,

                source:
                    "history-game",

                sourceId:
                    row.id

            });

        }


        /*
           If history itself has winning
        */

        const win =
            Number(
                row.win_amount || 0
            );

        if(win > 0){

            transactions.push({

                time:
                    new Date(
                        row.created_at
                    ),

                particulars:
                    `${row.market || "Game"} - Winning`,

                debit:
                    0,

                credit:
                    win,

                source:
                    "history-winning",

                sourceId:
                    row.id

            });

        }

    });


    /* =====================================
       2. DEPOSITS TABLE
    ===================================== */

    const depositRows =
        await getAllRows(
            "deposits",
            `
            id,
            user_id,
            amount,
            status,
            utr,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    Number(userId)
                )
                .gte(
                    "created_at",
                    startLocal
                )
                .lt(
                    "created_at",
                    endLocal
                )
                .order(
                    "created_at",
                    {ascending:true}
                )
        );


    depositRows.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();

        const allowed =
            [
                "accepted",
                "accept",
                "approved",
                "approve",
                "success",
                "successful",
                "completed",
                "complete",
                "clear",
                "cleared"
            ].includes(status);

        if(!allowed){

            return;
        }

        const amount =
            Number(
                row.amount || 0
            );

        if(amount <= 0){

            return;
        }

        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount,

            source:
                "deposit",

            sourceId:
                row.id,

            utr:
                row.utr || ""

        });

    });


    /* =====================================
       3. DEPOSIT REQUESTS
       If actual deposit table has no entry
    ===================================== */

    const depositRequestRows =
        await getAllRows(
            "deposit_requests",
            `
            id,
            user_id,
            amount,
            utr,
            status,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    Number(userId)
                )
                .gte(
                    "created_at",
                    startLocal
                )
                .lt(
                    "created_at",
                    endLocal
                )
                .order(
                    "created_at",
                    {ascending:true}
                )
        );


    depositRequestRows.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();

        const allowed =
            [
                "accepted",
                "accept",
                "approved",
                "approve",
                "success",
                "successful",
                "completed",
                "complete",
                "clear",
                "cleared"
            ].includes(status);

        if(!allowed){

            return;
        }

        const amount =
            Number(
                row.amount || 0
            );

        if(amount <= 0){

            return;
        }

        /*
           Don't duplicate if same UTR
           already exists in deposits.
        */

        const duplicate =
            transactions.some(t =>

                t.source === "deposit" &&
                (
                    (
                        row.utr &&

                        String(row.utr) ===
                        String(t.utr)
                    )
                    ||
                    (
                        Number(t.credit) === amount &&

                            t.time.getTime() -

                                row.created_at

                    )

            );

        if(duplicate){

            return;

        transactions.push({

            time:

            particulars:

            debit:
                0,

            credit:
                amount,

            source:
                "deposit-request",

            sourceId:
                row.id,

            utr:
                row.utr || ""

        });

    });


 /* =====================================

const winningRows =
    await getAllRows(

winningRows.forEach(row => {

    if(duplicate){

    transactions.push({

    /* =====================================

    try{

            });

        });

    }catch(e){

        );

    }


    /* =====================================
       6. ADMIN HISTORY
       old_balance -> new_balance
       se actual debit/credit niklega
    ===================================== */

    const adminHistoryRows =
        await getAllRows(
            "admin_history",

            id,

                )
                .gte(

                    startISO
                )
                .lt(
                    "created_at",
                    endISO
                )
                .order(
                    "created_at",
                    {ascending:true}
                )
        );


    adminHistoryRows.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();

        if(
            [
                "pending",
                "cancelled",
                "canceled",
                "rejected",
                "reject"
            ].includes(status)
        ){

        const oldBalance =

            Number(
                row.new_balance
            );


        let debit = 0;
        let credit = 0;


        /*
           Best method:
           new balance - old balance
        */

        if(
            Number.isFinite(oldBalance) &&
            Number.isFinite(newBalance)
        ){

            const difference =
                newBalance -
                oldBalance;

            if(difference < 0){

                debit =
                    Math.abs(difference);

            }

            if(difference > 0){

                credit =
                    difference;

            }

        }


        /*
           Fallback
        */

        if(
            debit === 0 &&
            credit === 0
        ){

            const amount =
                Number(
                    row.action_amount || 0
                );

            const type =
                String(
                    row.action_type || ""
                ).toLowerCase();


            if(amount > 0){

                if(
                    type.includes("withdraw") ||
                    type.includes("debit") ||
                    type.includes("remove") ||
                    type.includes("minus")
                ){

                    debit = amount;

                }else{

                    credit = amount;

                }

            }

        if(
            debit === 0 &&
            credit === 0
        ){

            return;
        }


        /*
           Duplicate check with withdraw/deposit
        */

        const duplicate =
            transactions.some(t => {

                if(
                    Math.abs(
                        t.time.getTime() -
                        new Date(
                            row.created_at
                        ).getTime()
                    ) >
                    5 * 60 * 1000
                ){

                    return false;
                }

                if(
                    debit > 0 &&
                    Number(t.debit) === debit
                ){

                    return true;
                }

                if(
                    credit > 0 &&
                    Number(t.credit) === credit
                ){

                    return true;
                }

                return false;

            });


        if(duplicate){

            return;
        }


        let particulars =
            row.action_type ||
            "Wallet Transaction";


        const typeText =
            String(
                particulars
            ).toLowerCase();


        if(
            typeText.includes("withdraw")
        ){

            particulars =
                "Withdraw";

        }else if(
            typeText.includes("deposit") ||
            typeText.includes("add") ||
            typeText.includes("credit")
        ){

            particulars =
                "Deposit";

        }


        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars,

            debit,

            credit,

            source:
                "admin-history",

            sourceId:
                row.id

        });

    });


    /* =====================================
       SORT ALL TRANSACTIONS
    ===================================== */

    transactions.sort(
        (a,b) =>
            a.time.getTime() -
            b.time.getTime()
    );


    /* =====================================
       CALCULATE OPENING BALANCE
    ===================================== */

    /*
       Opening balance is calculated from
       login.balance minus all transactions
       after the selected statement date.

       This gives a starting balance for the
       selected statement day.
    */

    let currentWallet =
        Number(
            selectedUser.balance || 0
        );


    /*
       Get transactions after selected
       statement period and reverse them.
    */

    const futureStart =
        end;

    const futureStartISO =
        futureStart.toISOString();


    let futureDebit = 0;
    let futureCredit = 0;


    /*
       Future history
    */

    const futureHistory =
        await getAllRows(
            "history",
            `
            id,
            user_id,
            total,
            win_amount,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    String(userId)
                )
                .gte(
                    "created_at",
                    futureStartISO
                )
                .order(
                    "created_at",
                    {ascending:true}
                )
        );


    futureHistory.forEach(row => {

        futureDebit +=
            Number(
                row.total || 0
            );

        futureCredit +=
            Number(
                row.win_amount || 0
            );

    });


    /*
       Because different tables may have
       different timestamp types, we calculate
       opening using current wallet and the
       selected statement transactions only
       when no reliable previous balance exists.

       For the selected day, use current wallet
       and reverse all known future history.
    */

    let openingBalance =
        currentWallet -
        futureCredit +
        futureDebit;


    /*
       Add selected-day movement backwards
       only if the current wallet is clearly
       after the selected day.
    */

    /*
       Better practical opening:
       current wallet minus today's net movement
       if statement represents current wallet.
    */

    const totalDebit =
        transactions.reduce(
            (sum,t) =>
                sum + Number(t.debit || 0),
            0
        );

    const totalCredit =
        transactions.reduce(
            (sum,t) =>
                sum + Number(t.credit || 0),
            0
        );


    /*
       If future data was found, opening is based
       on current wallet before selected day.
       Otherwise derive opening from current
       wallet and selected day net movement.
    */

    if(
        !Number.isFinite(openingBalance)
    ){

        openingBalance =
            currentWallet -
            totalCredit +
            totalDebit;

    }


    /*
       Do not show negative -0
    */

    if(
        Math.abs(openingBalance) < 0.00001
    ){

        openingBalance = 0;
    }


    openingBox.style.display =
        "flex";

    document.getElementById(
        "openingBalance"
    ).textContent =
        `₹${money(openingBalance)}`;


    /* =====================================
       BUILD STATEMENT
    ===================================== */

    if(transactions.length === 0){

        statementArea.innerHTML =
            `<div class="empty">
                Is date par koi transaction nahi mila.
            </div>`;

        return;
    }


    let runningBalance =
        openingBalance;


    let rowsHTML = "";


    transactions.forEach(t => {

        const debit =
            Number(t.debit || 0);

        const credit =
            Number(t.credit || 0);


        /*
           Debit minus
           Credit plus
        */

        runningBalance =
            runningBalance -
            debit +
            credit;


        if(
            Math.abs(runningBalance) <
            0.00001
        ){

            runningBalance = 0;
        }


        rowsHTML += `

            <tr>

                <td class="date-col">
                    ${formatDateTime(t.time)}
                </td>

                <td class="particular">
                    ${escapeHTML(t.particulars)}
                </td>

                <td class="money debit">
                    ${
                        debit > 0
                        ? "₹" + money(debit)
                        : "-"
                    }
                </td>

                <td class="money credit">
                    ${
                        credit > 0
                        ? "₹" + money(credit)
                        : "-"
                    }
                </td>

                <td class="balance">
                    ₹${money(runningBalance)}
                </td>

            </tr>

        `;

    });


    statementArea.innerHTML = `

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Date / Time
                        </th>

                        <th>
                            Particulars
                        </th>

                        <th>
                            Debit
                        </th>

                        <th>
                            Credit
                        </th>

                        <th>
                            Balance
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${rowsHTML}

                </tbody>

                <tfoot>

                    <tr>

                        <td
                            colspan="2"
                            class="total-label"
                        >
                            TOTAL
                        </td>

                        <td class="money debit">
                            ₹${money(totalDebit)}
                        </td>

                        <td class="money credit">
                            ₹${money(totalCredit)}
                        </td>

                        <td class="balance">
                            ₹${money(runningBalance)}
                        </td>

                    </tr>

                </tfoot>

            </table>

        </div>


        <div class="summary">

            <div class="summary-row">

                <span class="summary-title">
                    Opening Balance
                </span>

                <span class="summary-value">
                    ₹${money(openingBalance)}
                </span>

            </div>


            <div class="summary-row">

                <span class="summary-title">
                    Total Debit
                </span>

                <span class="summary-value debit">
                    ₹${money(totalDebit)}
                </span>

            </div>


            <div class="summary-row">

                <span class="summary-title">
                    Total Credit
                </span>

                <span class="summary-value credit">
                    ₹${money(totalCredit)}
                </span>

            </div>


            <div class="summary-row">

                <span class="summary-title">
                    Closing Balance
                </span>

                <span class="summary-value">
                    ₹${money(runningBalance)}
                </span>

            </div>

        </div>

    `;

}


/* =========================
   FORMAT DATE TIME
========================= */

function formatDateTime(date){

    const d =
        new Date(date);

    let hours =
        d.getHours();

    const minutes =
        pad(d.getMinutes());

    const seconds =
        pad(d.getSeconds());

    const ampm =
        hours >= 12
        ? "pm"
        : "am";

    hours =
        hours % 12;

    if(hours === 0){

        hours = 12;
    }

    return `
        ${pad(d.getDate())}/
        ${pad(d.getMonth()+1)}/
        ${d.getFullYear()},
        ${hours}:${minutes}:${seconds} ${ampm}
    `.replace(/\s+/g," ").trim();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

async function init(){

    await loadUsers();

    loadDates();

}

init();

</script>
