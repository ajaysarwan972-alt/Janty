<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const userSelect =
document.getElementById("userSelect");

const dateSelect =
document.getElementById("dateSelect");

const statementBody =
document.getElementById("statementBody");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const accountBox =
document.getElementById("accountBox");

const walletBox =
document.getElementById("walletBox");


/* =====================================================
   NUMBER
===================================================== */

function money(value){

    return Number(value || 0).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   DATE / TIME
===================================================== */

function formatDateTime(value){

    if(!value){
        return "-";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

    if(!value){
        return "-";
    }

    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =====================================================
   HTML SAFE
===================================================== */

function safe(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD ALL ROWS
   KOI 20 ENTRY LIMIT NAHI
   1000-1000 KARKAR SAB DATA
===================================================== */

async function getAll(
    table,
    columns,
    filters=[],
    orderColumn="id"
){

    let result = [];
    let start = 0;
    const pageSize = 1000;

    while(true){

        let query =
            db
            .from(table)
            .select(columns)
            .order(
                orderColumn,
                {ascending:true}
            )
            .range(
                start,
                start + pageSize - 1
            );

        filters.forEach(f => {

            if(f.type === "eq"){
                query =
                    query.eq(
                        f.column,
                        f.value
                    );
            }

            if(f.type === "gte"){
                query =
                    query.gte(
                        f.column,
                        f.value
                    );
            }

            if(f.type === "lt"){
                query =
                    query.lt(
                        f.column,
                        f.value
                    );
            }

        });

        const {data,error} =
            await query;

        if(error){
            throw error;
        }

        if(!data || data.length === 0){
            break;
        }

        result.push(...data);

        if(data.length < pageSize){
            break;
        }

        start += pageSize;
    }

    return result;
}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    errorBox.innerText = message;
    errorBox.style.display = "block";

}

function hideError(){

    errorBox.innerText = "";
    errorBox.style.display = "none";

}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

    try{

        const {data,error} =
            await db
            .from("login")
            .select(
                "id,name,mobile,balance"
            )
            .order(
                "id",
                {ascending:true}
            );

        if(error){
            throw error;
        }

        userSelect.innerHTML =
        `<option value="">
            Select User ID
        </option>`;

        (data || []).forEach(user => {

            const option =
                document.createElement("option");

            option.value =
                user.id;

            option.textContent =
                `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

            option.dataset.name =
                user.name || "";

            option.dataset.mobile =
                user.mobile || "";

            option.dataset.balance =
                user.balance || 0;

            userSelect.appendChild(option);

        });

    }catch(error){

        showError(
            "User load error: " +
            error.message
        );

    }

}


/* =====================================================
   LOAD DATES
===================================================== */

async function loadDates(){

    try{

        const rows =
            await getAll(
                "history",
                "game_date",
                [],
                "game_date"
            );

        const dates =
            [...new Set(
                rows
                .map(x => x.game_date)
                .filter(Boolean)
            )];

        dates.sort(
            (a,b) =>
                new Date(b) -
                new Date(a)
        );

        dateSelect.innerHTML =
        `<option value="">
            Select Date
        </option>`;

        dates.forEach(date => {

            const option =
                document.createElement("option");

            option.value = date;

            option.textContent =
                formatDate(date);

            dateSelect.appendChild(option);

        });

    }catch(error){

        showError(
            "Date load error: " +
            error.message
        );

    }

}


/* =====================================================
   5 AM TO NEXT DAY 5 AM
===================================================== */

function getRange(date){

    const start =
        new Date(
            date +
            "T05:00:00+05:30"
        );

    const end =
        new Date(
            start.getTime() +
            24 * 60 * 60 * 1000
        );

    return {
        start:start.toISOString(),
        end:end.toISOString()
    };

}


/* =====================================================
   ACTION TYPE
===================================================== */

function isDebitAction(action){

    const a =
        String(action || "")
        .toLowerCase();

    return (
        a.includes("withdraw") ||
        a.includes("debit") ||
        a.includes("deduct") ||
        a.includes("minus")
    );

}


function isCreditAction(action){

    const a =
        String(action || "")
        .toLowerCase();

    return (
        a.includes("deposit") ||
        a.includes("credit") ||
        a.includes("recharge") ||
        a.includes("topup") ||
        a.includes("top-up") ||
        a.includes("add")
    );

}


/* =====================================================
   LOAD STATEMENT
===================================================== */

async function loadStatement(){

    hideError();

    const userId =
        userSelect.value;

    const date =
        dateSelect.value;

    if(!userId || !date){

        statementBody.innerHTML =
        `<tr>
            <td colspan="4" class="empty">
                Select User ID and Date
            </td>
        </tr>`;

        accountBox.style.display = "none";
        walletBox.style.display = "none";

        return;
    }

    loading.style.display = "block";

    statementBody.innerHTML = "";

    const option =
        userSelect.options[
            userSelect.selectedIndex
        ];

    document.getElementById(
        "userIdText"
    ).innerText = userId;

    document.getElementById(
        "nameText"
    ).innerText =
        option.dataset.name || "-";

    document.getElementById(
        "mobileText"
    ).innerText =
        option.dataset.mobile || "-";

    document.getElementById(
        "dateText"
    ).innerText =
        formatDate(date);

    accountBox.style.display = "block";


    try{

        const range =
            getRange(date);


        /* =================================================
           HISTORY
        ================================================= */

        const history =
            await getAll(
                "history",
                `
                id,
                user_id,
                market,
                data,
                total,
                created_at,
                status,
                win_amount,
                typing,
                image,
                commission,
                mode,
                admin_action,
                admin_user_id,
                action_amount,
                action_type,
                ref_by,
                game_date
                `,
                [
                    {
                        type:"eq",
                        column:"user_id",
                        value:String(userId)
                    },
                    {
                        type:"eq",
                        column:"game_date",
                        value:date
                    }
                ],
                "created_at"
            );


        /* =================================================
           DEPOSITS
        ================================================= */

        const deposits =
            await getAll(
                "deposits",
                `
                id,
                user_id,
                amount,
                status,
                utr,
                created_at
                `,
                [
                    {
                        type:"eq",
                        column:"user_id",
                        value:Number(userId)
                    },
                    {
                        type:"gte",
                        column:"created_at",
                        value:range.start
                    },
                    {
                        type:"lt",
                        column:"created_at",
                        value:range.end
                    }
                ],
                "created_at"
            );


        /* =================================================
           ADMIN HISTORY
        ================================================= */

        let adminHistory = [];

        try{

            adminHistory =
                await getAll(
                    "admin_history",
                    `
                    id,
                    user_id,
                    admin_user_id,
                    action_type,
                    action_amount,
                    old_balance,
                    new_balance,
                    status,
                    created_at
                    `,
                    [
                        {
                            type:"eq",
                            column:"user_id",
                            value:Number(userId)
                        },
                        {
                            type:"gte",
                            column:"created_at",
                            value:range.start
                        },
                        {
                            type:"lt",
                            column:"created_at",
                            value:range.end
                        }
                    ],
                    "created_at"
                );

        }catch(e){

            console.log(
                "admin_history unavailable"
            );

        }


        /* =================================================
           ADMIN WINING
        ================================================= */

        let adminWining = [];

        try{

            adminWining =
                await getAll(
                    "admin wining",
                    `
                    id,
                    user_id,
                    amount,
                    created_at,
                    market
                    `,
                    [
                        {
                            type:"eq",
                            column:"user_id",
                            value:String(userId)
                        },
                        {
                            type:"gte",
                            column:"created_at",
                            value:range.start
                        },
                        {
                            type:"lt",
                            column:"created_at",
                            value:range.end
                        }
                    ],
                    "created_at"
                );

        }catch(e){

            console.log(
                "admin wining unavailable"
            );

        }


        /* =================================================
           LEDGER
        ================================================= */

        let ledger = [];


        /* =================================================
           DEPOSITS = CREDIT
        ================================================= */

        deposits.forEach(row => {

            const status =
                String(
                    row.status || ""
                ).toLowerCase();

            const valid =
                !status ||
                status === "accepted" ||
                status === "approved" ||
                status === "success" ||
                status === "successful" ||
                status === "completed" ||
                status === "complete";

            if(!valid){
                return;
            }

            const amount =
                Number(row.amount || 0);

            if(amount <= 0){
                return;
            }

            ledger.push({

                source:"deposit",

                id:"deposit_"+row.id,

                created_at:row.created_at,

                particulars:
                    row.utr
                    ? "Deposit - UTR " + row.utr
                    : "Deposit",

                debit:0,

                credit:amount

            });

        });


        /* =================================================
           HISTORY GAME + WINNING
        ================================================= */

        let historyHasWinning = false;

        history.forEach(row => {

            const total =
                Number(row.total || 0);

            const winning =
                Number(row.win_amount || 0);

            const action =
                String(
                    row.action_type || ""
                ).toLowerCase();


            /* Explicit Withdraw */

            if(
                isDebitAction(action) &&
                Number(row.action_amount || 0) > 0
            ){

                ledger.push({

                    source:"history_action",

                    id:
                        "history_action_" +
                        row.id,

                    created_at:
                        row.created_at,

                    particulars:
                        "Withdraw",

                    debit:
                        Number(
                            row.action_amount
                        ),

                    credit:0

                });

            }


            /* Explicit Wallet Credit */

            else if(
                isCreditAction(action) &&
                Number(row.action_amount || 0) > 0
            ){

                ledger.push({

                    source:"history_action",

                    id:
                        "history_credit_" +
                        row.id,

                    created_at:
                        row.created_at,

                    particulars:
                        "Wallet Credit",

                    debit:0,

                    credit:
                        Number(
                            row.action_amount
                        )

                });

            }


            /* Normal Game */

            else if(total > 0){

                ledger.push({

                    source:"game",

                    id:
                        "game_" +
                        row.id,

                    created_at:
                        row.created_at,

                    particulars:
                        (
                            row.market
                            ? row.market + " - "
                            : ""
                        ) +
                        "Game / Bet",

                    debit:total,

                    credit:0

                });

            }


            /* Winning */

            if(winning > 0){

                historyHasWinning = true;

                ledger.push({

                    source:"winning",

                    id:
                        "history_win_" +
                        row.id,

                    created_at:
                        row.created_at,

                    particulars:
                        (
                            row.market
                            ? row.market + " - "
                            : ""
                        ) +
                        "Winning",

                    debit:0,

                    credit:winning

                });

            }

        });


        /* =================================================
           ADMIN WINING
           ONLY IF HISTORY WINNING NOT PRESENT
        ================================================= */

        if(!historyHasWinning){

            adminWining.forEach(row => {

                const amount =
                    Number(row.amount || 0);

                if(amount <= 0){
                    return;
                }

                ledger.push({

                    source:"winning",

                    id:
                        "admin_win_" +
                        row.id,

                    created_at:
                        row.created_at,

                    particulars:
                        (
                            row.market
                            ? row.market + " - "
                            : ""
                        ) +
                        "Winning",

                    debit:0,

                    credit:amount

                });

            });

        }


        /* =================================================
           ADMIN HISTORY
        ================================================= */

        adminHistory.forEach(row => {

            const amount =
                Number(
                    row.action_amount || 0
                );

            if(amount <= 0){
                return;
            }

            const action =
                String(
                    row.action_type || ""
                ).toLowerCase();


            if(isDebitAction(action)){

                ledger.push({

                    source:"admin_history",

                    id:
                        "admin_debit_" +
                        row.id,

                    created_at:
                        row.created_at,

                    particulars:
                        "Withdraw",

                    debit:amount,

                    credit:0

                });

            }

            else if(isCreditAction(action)){

                /*
                   Agar same amount ka accepted deposit
                   already hai to duplicate nahi banayenge.
                */

                const duplicate =
                    deposits.some(dep => {

                        const depAmount =
                            Number(
                                dep.amount || 0
                            );

                        if(depAmount !== amount){
                            return false;
                        }

                        const t1 =
                            new Date(
                                dep.created_at
                            ).getTime();

                        const t2 =
                            new Date(
                                row.created_at
                            ).getTime();

                        return (
                            Math.abs(t1-t2)
                            <=
                            5 * 60 * 1000
                        );

                    });

                if(!duplicate){

                    ledger.push({

                        source:"admin_history",

                        id:
                            "admin_credit_" +
                            row.id,

                        created_at:
                            row.created_at,

                        particulars:
                            "Wallet Credit",

                        debit:0,

                        credit:amount

                    });

                }

            }

        });


        /* =================================================
           TIME ORDER
        ================================================= */

        ledger.sort(
            (a,b) =>
                new Date(a.created_at) -
                new Date(b.created_at)
        );


        /* =================================================
           TOTAL
        ================================================= */

        let totalDebit = 0;
        let totalCredit = 0;

        ledger.forEach(row => {

            totalDebit +=
                Number(row.debit || 0);

            totalCredit +=
                Number(row.credit || 0);

        });


        /* =================================================
           DISPLAY
        ================================================= */

        if(ledger.length === 0){

            statementBody.innerHTML =
            `<tr>
                <td colspan="4" class="empty">
                    Is date par koi transaction nahi mila.
                </td>
            </tr>`;

        }else{

            let html = "";

            ledger.forEach(row => {

                const debit =
                    Number(row.debit || 0);

                const credit =
                    Number(row.credit || 0);

                html += `
                <tr>

                    <td class="time">
                        ${formatDateTime(
                            row.created_at
                        )}
                    </td>

                    <td class="particular">
                        ${safe(
                            row.particulars
                        )}
                    </td>

                    <td class="debit">
                        ${
                            debit > 0
                            ? "₹" + money(debit)
                            : "-"
                        }
                    </td>

                    <td class="credit">
                        ${
                            credit > 0
                            ? "₹" + money(credit)
                            : "-"
                        }
                    </td>

                </tr>
                `;

            });


            /* ==========================================
               FINAL TOTAL ROW
            ========================================== */

            html += `
            <tr class="total-row">

                <td>
                    TOTAL
                </td>

                <td>
                    All Transactions
                </td>

                <td class="total-debit">
                    ₹${money(totalDebit)}
                </td>

                <td class="total-credit">
                    ₹${money(totalCredit)}
                </td>

            </tr>
            `;

            statementBody.innerHTML =
                html;

        }


        /* =================================================
           CURRENT LOGIN BALANCE
        ================================================= */

        const currentBalance =
            Number(
                option.dataset.balance || 0
            );

        document.getElementById(
            "walletAmount"
        ).innerText =
            money(currentBalance);

        walletBox.style.display = "flex";


    }catch(error){

        console.error(error);

        statementBody.innerHTML =
        `<tr>
            <td colspan="4" class="empty">
                Statement load nahi hui.
            </td>
        </tr>`;

        showError(
            "Statement Error: " +
            error.message
        );

    }finally{

        loading.style.display = "none";

    }

}

   EVENTS

userSelect.addEventListener(
    "change",
    loadStatement
);

);
