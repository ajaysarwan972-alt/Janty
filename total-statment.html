<body>

<div class="container">

    <h1>USER BANK STATEMENT</h1>

    <!-- USER + DATE -->

    <div class="filters">

    <!-- USER DETAILS -->

    <div

        style="display:none;"
    >

        <h2>User Details</h2>

            <div class="detail">
                <div class="detail-title">

                <div
                    id="detailId"

                    -
                </div>

            <div class="detail">
                <div class="detail-title">
                    Name
                </div>

                <div
                    id="detailName"
                    class="detail-value"

                    -
                </div>

            <div class="detail">
                <div class="detail-title">

    >

            id="openingBalance"
            class="opening-value"
        >
            ₹0.00
        </div>

    <!-- STATEMENT -->

    <div id="statementArea">

        <div class="empty">

        </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const userSelect =
document.getElementById("userSelect");

const dateSelect =
document.getElementById("dateSelect");

const userDetails =
document.getElementById("userDetails");

const openingBox =
document.getElementById("openingBox");

const statementArea =
document.getElementById("statementArea");


let users = [];

let selectedUser = null;


/* =========================================
   MONEY
========================================= */

function money(value){

    return Number(value || 0).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================
   PAD
========================================= */

function pad(n){

    return String(n).padStart(2,"0");

}


/* =========================================
   DATE ONLY
========================================= */

function formatDateOnly(date){

    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth()+1) +
        "-" +
        pad(date.getDate())
    );

}


/* =========================================
   DISPLAY DATE
========================================= */

function displayDate(date){

    return (
        pad(date.getDate()) +
        "/" +
        pad(date.getMonth()+1) +
        "/" +
        date.getFullYear()
    );

}


/* =========================================
   STATEMENT RANGE

   5:00 AM
   TO
   NEXT DAY 4:59:59 AM
========================================= */

function statementRange(dateString){

    const start =
        new Date(
            dateString + "T05:00:00"
        );

    const end =
        new Date(start);

    end.setDate(
        end.getDate() + 1
    );

    return {
        start,
        end
    };

}


/* =========================================
   LOCAL TIMESTAMP
========================================= */

function localDateTimeString(date){

    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth()+1) +
        "-" +
        pad(date.getDate()) +
        " " +
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes()) +
        ":" +
        pad(date.getSeconds())
    );

}


/* =========================================
   GET ALL ROWS
========================================= */

async function getAllRows(
    table,
    select,
    filterFunction,
    pageSize = 1000
){

    let all = [];

    let from = 0;

    while(true){

        let query =
            supabaseClient
            .from(table)
            .select(select);

        query =
            filterFunction(query);

        const {
            data,
            error
        } =
        await query.range(
            from,
            from + pageSize - 1
        );

        if(error){

            console.error(
                "Table:",
                table,
                error
            );

            break;
        }

        if(data && data.length){

            all.push(...data);

        }

        if(
            !data ||
            data.length < pageSize
        ){

            break;
        }

        from += pageSize;

    }

    return all;

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("login")
    .select(
        "id,name,mobile,balance"
    )
    .order(
        "id",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);

        alert(
            "User list load nahi hui."
        );

        return;
    }


    users = data || [];


    userSelect.innerHTML =
        `<option value="">
            Select User ID
        </option>`;


    users.forEach(user => {

        const option =
            document.createElement("option");

        option.value =
            user.id;

        option.textContent =
            `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

        userSelect.appendChild(
            option
        );

    });

}


/* =========================================
   LOAD DATES
========================================= */

function loadDates(){

    dateSelect.innerHTML =
        `<option value="">
            Select Date
        </option>`;


    const today =
        new Date();


    for(
        let i = 0;
        i < 30;
        i++
    ){

        const d =
            new Date(today);

        d.setDate(
            today.getDate() - i
        );


        const option =
            document.createElement("option");


        option.value =
            formatDateOnly(d);


        option.textContent =
            displayDate(d);


        dateSelect.appendChild(
            option
        );

    }

}


/* =========================================
   USER CHANGE
========================================= */

userSelect.addEventListener(
    "change",
    async function(){

        const id =
            this.value;


        selectedUser =
            users.find(
                user =>
                    String(user.id) ===
                    String(id)
            );


        if(!selectedUser){

            userDetails.style.display =
                "none";

            openingBox.style.display =
                "none";

            statementArea.innerHTML =
                `<div class="empty">
                    User ID और Statement Date select करें
                </div>`;

            return;
        }


        document.getElementById(
            "detailId"
        ).textContent =
            selectedUser.id;


        document.getElementById(
            "detailName"
        ).textContent =
            selectedUser.name || "-";


        document.getElementById(
            "detailMobile"
        ).textContent =
            selectedUser.mobile || "-";


        userDetails.style.display =
            "block";


        if(dateSelect.value){

            await loadStatement();

        }

    }
);


/* =========================================
   DATE CHANGE
========================================= */

dateSelect.addEventListener(
    "change",
    async function(){

        if(
            userSelect.value &&
            dateSelect.value
        ){

            await loadStatement();

        }

    }
);


/* =========================================
   LOAD STATEMENT
========================================= */

async function loadStatement(){

    if(
        !userSelect.value ||
        !dateSelect.value
    ){

        return;
    }


    statementArea.innerHTML =
        `<div class="loading">
            Loading statement...
        </div>`;


    const userId =
        userSelect.value;


    const selectedDate =
        dateSelect.value;


    const range =
        statementRange(
            selectedDate
        );


    const start =
        range.start;


    const end =
        range.end;


    const startISO =
        start.toISOString();


    const endISO =
        end.toISOString();


    const startLocal =
        localDateTimeString(start);


    const endLocal =
        localDateTimeString(end);


    let transactions = [];


    /* =====================================
       1. HISTORY = GAME / BET
    ===================================== */

    const historyRows =
        await getAllRows(
            "history",
            `
            id,
            user_id,
            market,
            total,
            created_at,
            status,
            game_date
            `,
            query =>
                query
                .eq(
                    "user_id",
                    String(userId)
                )
                .gte(
                    "game_date",
                    selectedDate
                )
                .lt(
                    "game_date",
                    formatDateOnly(end)
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
        );


    historyRows.forEach(row => {

        const amount =
            Number(
                row.total || 0
            );


        if(amount <= 0){

            return;
        }


        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars:
                `${row.market || "Game"} - Game / Bet`,

            debit:
                amount,

            credit:
                0,

            source:
                "history",

            sourceId:
                row.id

        });

    });


    /* =====================================
       2. DEPOSITS
    ===================================== */

    const depositRows =
        await getAllRows(
            "deposits",
            `
            id,
            user_id,
            amount,
            status,
            utr,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    Number(userId)
                )
                .gte(
                    "created_at",
                    startLocal
                )
                .lt(
                    "created_at",
                    endLocal
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
        );


    depositRows.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();


        const allowedStatuses = [

            "accepted",
            "accept",
            "approved",
            "approve",
            "success",
            "successful",
            "completed",
            "complete",
            "clear",
            "cleared"

        ];


        if(
            !allowedStatuses.includes(
                status
            )
        ){

            return;
        }


        const amount =
            Number(
                row.amount || 0
            );


        if(amount <= 0){

            return;
        }


        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount,

            source:
                "deposit",

            sourceId:
                row.id,

            utr:
                row.utr || ""

        });

    });


    /* =====================================
       3. DEPOSIT REQUESTS
       Only add if not duplicate
    ===================================== */

    const depositRequestRows =
        await getAllRows(
            "deposit_requests",
            `
            id,
            user_id,
            amount,
            utr,
            status,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    Number(userId)
                )
                .gte(
                    "created_at",
                    startLocal
                )
                .lt(
                    "created_at",
                    endLocal
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
        );


    depositRequestRows.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();


        const allowedStatuses = [

            "accepted",
            "accept",
            "approved",
            "approve",
            "success",
            "successful",
            "completed",
            "complete",
            "clear",
            "cleared"

        ];


        if(
            !allowedStatuses.includes(
                status
            )
        ){

            return;
        }


        const amount =
            Number(
                row.amount || 0
            );


        if(amount <= 0){

            return;
        }


        const rowTime =
            new Date(
                row.created_at
            ).getTime();


        const duplicate =
            transactions.some(t => {

                if(
                    t.source !== "deposit"
                ){

                    return false;
                }


                const timeDiff =
                    Math.abs(
                        t.time.getTime() -
                        rowTime
                    );


                if(
                    row.utr &&
                    t.utr &&
                    String(row.utr) ===
                    String(t.utr)
                ){

                    return true;
                }


                return (
                    Number(t.credit) === amount &&
                    timeDiff <=
                    5 * 60 * 1000
                );

            });


        if(duplicate){

            return;
        }


        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars:
                "Deposit",

            debit:
                0,

            credit:
                amount,

            source:
                "deposit-request",

            sourceId:
                row.id

        });

    });


    /* =====================================
       4. ADMIN WINING
       THIS IS THE WINNING SOURCE
    ===================================== */

    const winningRows =
        await getAllRows(
            "admin wining",
            `
            id,
            user_id,
            amount,
            created_at,
            market
            `,
            query =>
                query
                .eq(
                    "user_id",
                    String(userId)
                )
                .gte(
                    "created_at",
                    startLocal
                )
                .lt(
                    "created_at",
                    endLocal
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
        );


    winningRows.forEach(row => {

        const amount =
            Number(
                row.amount || 0
            );


        if(amount <= 0){

            return;
        }


        /*
           IMPORTANT:
           Winning = CREDIT
           Credit balance me add hota hai.
        */

        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars:
                `${row.market || "Game"} - Winning`,

            debit:
                0,

            credit:
                amount,

            source:
                "admin-winning",

            sourceId:
                row.id

        });

    });


    /* =====================================
       5. WITHDRAW REQUESTS
    ===================================== */

    try{

        const withdrawRows =
            await getAllRows(
                "withdraw_requests",
                `
                id,
                user_id,
                amount,
                status,
                created_at
                `,
                query =>
                    query
                    .eq(
                        "user_id",
                        Number(userId)
                    )
                    .gte(
                        "created_at",
                        startLocal
                    )
                    .lt(
                        "created_at",
                        endLocal
                    )
                    .order(
                        "created_at",
                        {
                            ascending:true
                        }
                    )
            );


        withdrawRows.forEach(row => {

            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            const allowedStatuses = [

                "accepted",
                "accept",
                "approved",
                "approve",
                "success",
                "successful",
                "completed",
                "complete",
                "clear",
                "cleared"

            ];


            if(
                !allowedStatuses.includes(
                    status
                )
            ){

                return;
            }


            const amount =
                Number(
                    row.amount || 0
                );


            if(amount <= 0){

                return;
            }


            transactions.push({

                time:
                    new Date(
                        row.created_at
                    ),

                particulars:
                    "Withdraw",

                debit:
                    amount,

                credit:
                    0,

                source:
                    "withdraw",

                sourceId:
                    row.id

            });

        });

    }
    catch(error){

        console.log(
            "withdraw_requests table not available"
        );

    }


    /* =====================================
       6. ADMIN HISTORY
       Manual wallet transactions
    ===================================== */

    const adminHistoryRows =
        await getAllRows(
            "admin_history",
            `
            id,
            user_id,
            action_type,
            action_amount,
            old_balance,
            new_balance,
            status,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    Number(userId)
                )
                .gte(
                    "created_at",
                    startISO
                )
                .lt(
                    "created_at",
                    endISO
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
        );


    adminHistoryRows.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            [
                "pending",
                "cancelled",
                "canceled",
                "rejected",
                "reject"
            ].includes(status)
        ){

            return;
        }


        let debit = 0;
        let credit = 0;


        const oldBalance =
            Number(
                row.old_balance
            );


        const newBalance =
            Number(
                row.new_balance
            );


        /*
           old_balance -> new_balance
           se exact movement
        */

        if(
            Number.isFinite(oldBalance) &&
            Number.isFinite(newBalance)
        ){

            const difference =
                newBalance -
                oldBalance;


            if(difference < 0){

                debit =
                    Math.abs(difference);

            }


            if(difference > 0){

                credit =
                    difference;

            }

        }


        /*
           Agar balance available nahi hai
        */

        if(
            debit === 0 &&
            credit === 0
        ){

            const amount =
                Number(
                    row.action_amount || 0
                );


            const type =
                String(
                    row.action_type || ""
                ).toLowerCase();


            if(amount > 0){

                if(
                    type.includes("withdraw") ||
                    type.includes("debit") ||
                    type.includes("remove") ||
                    type.includes("minus")
                ){

                    debit = amount;

                }
                else{

                    credit = amount;

                }

            }

        }


        if(
            debit === 0 &&
            credit === 0
        ){

            return;
        }


        /*
           Deposit/Withdraw tables ke saath
           duplicate check
        */

        const duplicate =
            transactions.some(t => {

                const diff =
                    Math.abs(
                        t.time.getTime() -
                        new Date(
                            row.created_at
                        ).getTime()
                    );


                if(
                    diff >
                    5 * 60 * 1000
                ){

                    return false;
                }


                if(
                    debit > 0 &&
                    Number(t.debit) === debit
                ){

                    return true;
                }


                if(
                    credit > 0 &&
                    Number(t.credit) === credit
                ){

                    return true;
                }


                return false;

            });


        if(duplicate){

            return;
        }


        let particulars =
            row.action_type ||
            "Wallet Transaction";


        const type =
            String(
                particulars
            ).toLowerCase();


        if(
            type.includes("withdraw")
        ){

            particulars =
                "Withdraw";

        }
        else if(
            type.includes("deposit") ||
            type.includes("add") ||
            type.includes("credit")
        ){

            particulars =
                "Deposit";

        }


        transactions.push({

            time:
                new Date(
                    row.created_at
                ),

            particulars,

            debit,

            credit,

            source:
                "admin-history",

            sourceId:
                row.id

        });

    });


    /* =====================================
       SORT BY TIME
    ===================================== */

    transactions.sort(
        (a,b) =>
            a.time.getTime() -
            b.time.getTime()
    );


    /* =====================================
       CURRENT WALLET
    ===================================== */

    const currentWallet =
        Number(
            selectedUser.balance || 0
        );


    /* =====================================
       TOTALS
    ===================================== */

    const totalDebit =
        transactions.reduce(
            (sum,t) =>
                sum +
                Number(t.debit || 0),
            0
        );


    const totalCredit =
        transactions.reduce(
            (sum,t) =>
                sum +
                Number(t.credit || 0),
            0
        );


    /* =====================================
       OPENING BALANCE

       Current Wallet
       minus future transactions
    ===================================== */

    let futureDebit = 0;

    let futureCredit = 0;


    /*
       Future HISTORY
    */

    const futureHistory =
        await getAllRows(
            "history",
            `
            id,
            user_id,
            total,
            created_at,
            game_date
            `,
            query =>
                query
                .eq(
                    "user_id",
                    String(userId)
                )
                .gte(
                    "game_date",
                    formatDateOnly(end)
                )
        );


    futureHistory.forEach(row => {

        futureDebit +=
            Number(
                row.total || 0
            );

    });


    /*
       Future ADMIN WINING
    */

    const futureWinning =
        await getAllRows(
            "admin wining",
            `
            id,
            user_id,
            amount,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    String(userId)
                )
                .gte(
                    "created_at",
                    endLocal
                )
        );


    futureWinning.forEach(row => {

        futureCredit +=
            Number(
                row.amount || 0
            );

    });


    /*
       Future DEPOSITS
    */

    const futureDeposits =
        await getAllRows(
            "deposits",
            `
            id,
            user_id,
            amount,
            status,
            created_at
            `,
            query =>
                query
                .eq(
                    "user_id",
                    Number(userId)
                )
                .gte(
                    "created_at",
                    endLocal
                )
        );


    futureDeposits.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            [
                "accepted",
                "accept",
                "approved",
                "approve",
                "success",
                "successful",
                "completed",
                "complete",
                "clear",
                "cleared"
            ].includes(status)
        ){

            futureCredit +=
                Number(
                    row.amount || 0
                );

        }

    });


    /*
       Future Withdraw
    */

    try{

        const futureWithdraw =
            await getAllRows(
                "withdraw_requests",
                `
                id,
                user_id,
                amount,
                status,
                created_at
                `,
                query =>
                    query
                    .eq(
                        "user_id",
                        Number(userId)
                    )
                    .gte(
                        "created_at",
                        endLocal
                    )
            );


        futureWithdraw.forEach(row => {

            const status =
                String(
                    row.status || ""
                ).toLowerCase();


            if(
                [
                    "accepted",
                    "accept",
                    "approved",
                    "approve",
                    "success",
                    "successful",
                    "completed",
                    "complete",
                    "clear",
                    "cleared"
                ].includes(status)
            ){

                futureDebit +=
                    Number(
                        row.amount || 0
                    );

            }

        });

    }
    catch(error){

        console.log(
            "Future withdraw table not available"
        );

    }


    /*
       Opening Balance
    */

    let openingBalance =
        currentWallet -
        futureCredit +
        futureDebit;


    if(
        !Number.isFinite(openingBalance)
    ){

        openingBalance = 0;

    }


    if(
        Math.abs(openingBalance) <
        0.00001
    ){

        openingBalance = 0;

    }


    /* =====================================
       SHOW OPENING
    ===================================== */

    openingBox.style.display =
        "flex";


    document.getElementById(
        "openingBalance"
    ).textContent =
        `₹${money(openingBalance)}`;


    /* =====================================
       NO TRANSACTIONS
    ===================================== */

    if(
        transactions.length === 0
    ){

        statementArea.innerHTML =
            `<div class="empty">
                Is date par koi transaction nahi mila.
            </div>`;

        return;
    }


    /* =====================================
       RUNNING BALANCE
    ===================================== */

    let runningBalance =
        openingBalance;


    let rowsHTML = "";


    transactions.forEach(t => {

        const debit =
            Number(
                t.debit || 0
            );


        const credit =
            Number(
                t.credit || 0
            );


        /*
           Debit = MINUS
           Credit = PLUS
        */

        runningBalance =
            runningBalance -
            debit +
            credit;


        if(
            Math.abs(runningBalance) <
            0.00001
        ){

            runningBalance = 0;

        }


        rowsHTML += `

        <tr>

            <td class="date-col">
                ${formatDateTime(t.time)}
            </td>


            <td class="particular">
                ${escapeHTML(t.particulars)}
            </td>


            <td class="money debit">

                ${
                    debit > 0
                    ? "₹" + money(debit)
                    : "-"
                }

            </td>


            <td class="money credit">

                ${
                    credit > 0
                    ? "₹" + money(credit)
                    : "-"
                }

            </td>


            <td class="balance">
                ₹${money(runningBalance)}
            </td>

        </tr>

        `;

    });


    /* =====================================
       FINAL TABLE
    ===================================== */

    statementArea.innerHTML = `

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Date / Time
                    </th>

                    <th>
                        Particulars
                    </th>

                    <th>
                        Debit
                    </th>

                    <th>
                        Credit
                    </th>

                    <th>
                        Balance
                    </th>

                </tr>

            </thead>


            <tbody>

                ${rowsHTML}

            </tbody>


            <tfoot>

                <tr>

                    <td
                        colspan="2"
                        class="total-label"
                    >
                        TOTAL
                    </td>


                    <td class="money debit">
                        ₹${money(totalDebit)}
                    </td>


                    <td class="money credit">
                        ₹${money(totalCredit)}
                    </td>


                    <td class="balance">
                        ₹${money(runningBalance)}
                    </td>

                </tr>

            </tfoot>

        </table>

    </div>


    <div class="summary">

        <div class="summary-row">

            <span class="summary-title">
                Opening Balance
            </span>

            <span class="summary-value">
                ₹${money(openingBalance)}
            </span>

        </div>


        <div class="summary-row">

            <span class="summary-title">
                Total Debit
            </span>

            <span class="summary-value debit">
                ₹${money(totalDebit)}
            </span>

        </div>


        <div class="summary-row">

            <span class="summary-title">
                Total Credit
            </span>

            <span class="summary-value credit">
                ₹${money(totalCredit)}
            </span>

        </div>


        <div class="summary-row">

            <span class="summary-title">
                Closing Balance
            </span>

            <span class="summary-value">
                ₹${money(runningBalance)}
            </span>

        </div>

    </div>

    `;

}


/* =========================================
   FORMAT DATE TIME
========================================= */

function formatDateTime(date){

    const d =
        new Date(date);


    let hours =
        d.getHours();


    const minutes =
        pad(
            d.getMinutes()
        );


    const seconds =
        pad(
            d.getSeconds()
        );


    const ampm =
        hours >= 12
        ? "pm"
        : "am";


    hours =
        hours % 12;


    if(hours === 0){

        hours = 12;

    }


    return (
        pad(d.getDate()) +
        "/" +
        pad(d.getMonth()+1) +
        "/" +
        d.getFullYear() +
        ", " +
        hours +
        ":" +
        minutes +
        ":" +
        seconds +
        " " +
        ampm
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   START
========================================= */

async function init(){

    await loadUsers();

    loadDates();

}

init();

</script>
