<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const userSelect =
document.getElementById("userSelect");

const dateSelect =
document.getElementById("dateSelect");

const statementBody =
document.getElementById("statementBody");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const userInfo =
document.getElementById("userInfo");

const walletBox =
document.getElementById("walletBox");

const currentWallet =
document.getElementById("currentWallet");


/* =========================================
   ALL ROWS FETCH
   Supabase ki 1000-row limit se bachne ke liye
========================================= */

async function fetchAllRows(table, columns, filters = [], orderColumn = "id"){

    let allRows = [];
    let from = 0;
    const batchSize = 1000;

    while(true){

        let query =
            supabaseClient
            .from(table)
            .select(columns)
            .order(orderColumn, {ascending:true})
            .range(from, from + batchSize - 1);

        for(const filter of filters){

            if(filter.type === "eq"){
                query = query.eq(filter.column, filter.value);
            }

            if(filter.type === "gte"){
                query = query.gte(filter.column, filter.value);
            }

            if(filter.type === "lt"){
                query = query.lt(filter.column, filter.value);
            }

            if(filter.type === "not"){
                query = query.not(
                    filter.column,
                    filter.operator,
                    filter.value
                );
            }

        }

        const {data,error} = await query;

        if(error){
            throw error;
        }

        if(!data || data.length === 0){
            break;
        }

        allRows.push(...data);

        if(data.length < batchSize){
            break;
        }

        from += batchSize;
    }

    return allRows;
}


/* =========================================
   ERROR
========================================= */

function showError(message){

    errorBox.innerText = message;
    errorBox.style.display = "block";

}

function hideError(){

    errorBox.innerText = "";
    errorBox.style.display = "none";

}


/* =========================================
   FORMAT
========================================= */

function money(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


function formatDateTime(value){

    if(!value){
        return "-";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}


/* =========================================
   INDIA TIME
========================================= */

function getIndiaDateTime(date){

    return new Date(
        date.toLocaleString(
            "en-US",
            {
                timeZone:"Asia/Kolkata"
            }
        )
    );

}


/* =========================================
   DATE RANGE
   5 AM -> Next Day 5 AM
========================================= */

function getStatementRange(gameDate){

    const start =
        new Date(
            gameDate + "T05:00:00+05:30"
        );

    const end =
        new Date(start.getTime() + 24*60*60*1000);

    return {
        start,
        end
    };

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers(){

    try{

        const {data,error} =
            await supabaseClient
            .from("login")
            .select("id,name,mobile,balance")
            .order("id",{ascending:true});

        if(error){
            throw error;
        }

        userSelect.innerHTML =
        `<option value="">Select User ID</option>`;

        (data || []).forEach(user => {

            const option =
            document.createElement("option");

            option.value =
                user.id;

            option.textContent =
                `${user.id} - ${user.name || ""} - ${user.mobile || ""}`;

            option.dataset.name =
                user.name || "";

            option.dataset.mobile =
                user.mobile || "";

            option.dataset.balance =
                user.balance || 0;

            userSelect.appendChild(option);

        });

    }catch(error){

        console.error(error);

        showError(
            "User list load nahi hui: " +
            error.message
        );

    }

}


/* =========================================
   LOAD STATEMENT DATES
   history.game_date se
========================================= */

async function loadDates(){

    try{

        const data =
            await fetchAllRows(
                "history",
                "game_date",
                [
                    {
                        type:"not",
                        column:"game_date",
                        operator:"is",
                        value:null
                    }
                ],
                "game_date"
            );

        const dates = [...new Set(
            (data || [])
            .map(row => row.game_date)
            .filter(Boolean)
        )];

        dates.sort(
            (a,b) =>
            new Date(b) - new Date(a)
        );

        dateSelect.innerHTML =
        `<option value="">Select Date</option>`;

        dates.forEach(date => {

            const option =
                document.createElement("option");

            option.value = date;

            const d =
                new Date(date + "T00:00:00");

            option.textContent =
                d.toLocaleDateString(
                    "en-IN",
                    {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric"
                    }
                );

            dateSelect.appendChild(option);

        });

    }catch(error){

        console.error(error);

        showError(
            "Date list load nahi hui: " +
            error.message
        );

    }

}


/* =========================================
   ACTION TYPE CHECK
========================================= */

function isWithdrawAction(action){

    const a =
        String(action || "").toLowerCase();

    return (
        a.includes("withdraw") ||
        a.includes("debit") ||
        a.includes("deduct") ||
        a.includes("minus")
    );

}


function isCreditAction(action){

    const a =
        String(action || "").toLowerCase();

    return (
        a.includes("deposit") ||
        a.includes("add") ||
        a.includes("recharge") ||
        a.includes("credit") ||
        a.includes("topup") ||
        a.includes("top-up")
    );

}


/* =========================================
   LOAD STATEMENT
========================================= */

async function loadStatement(){

    hideError();

    const userId =
        userSelect.value;

    const selectedDate =
        dateSelect.value;

    if(!userId || !selectedDate){

        statementBody.innerHTML =
        `<tr>
            <td colspan="4" class="empty">
                Select User ID and Date
            </td>
        </tr>`;

        userInfo.style.display = "none";
        walletBox.style.display = "none";

        return;
    }

    loading.style.display = "block";

    statementBody.innerHTML = "";

    const selectedOption =
        userSelect.options[
            userSelect.selectedIndex
        ];

    document.getElementById("showUserId").innerText =
        userId;

    document.getElementById("showName").innerText =
        selectedOption.dataset.name || "-";

    document.getElementById("showMobile").innerText =
        selectedOption.dataset.mobile || "-";

    document.getElementById("showDate").innerText =
        new Date(
            selectedDate + "T00:00:00"
        ).toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );

    userInfo.style.display = "block";


    try{

        const range =
            getStatementRange(selectedDate);

        const startISO =
            range.start.toISOString();

        const endISO =
            range.end.toISOString();


        /* =====================================
           1. HISTORY
        ===================================== */

        const historyRows =
            await fetchAllRows(
                "history",
                "id,user_id,market,data,total,created_at,status,win_amount,typing,image,commission,mode,admin_action,admin_user_id,action_amount,action_type,ref_by,game_date",
                [
                    {
                        type:"eq",
                        column:"user_id",
                        value:String(userId)
                    },
                    {
                        type:"eq",
                        column:"game_date",
                        value:selectedDate
                    }
                ],
                "created_at"
            );


        /* =====================================
           2. DEPOSITS
        ===================================== */

        const depositRows =
            await fetchAllRows(
                "deposits",
                "id,user_id,amount,status,utr,created_at",
                [
                    {
                        type:"eq",
                        column:"user_id",
                        value:Number(userId)
                    },
                    {
                        type:"gte",
                        column:"created_at",
                        value:startISO
                    },
                    {
                        type:"lt",
                        column:"created_at",
                        value:endISO
                    }
                ],
                "created_at"
            );


        /* =====================================
           3. ADMIN HISTORY
        ===================================== */

        let adminHistoryRows = [];

        try{

            adminHistoryRows =
                await fetchAllRows(
                    "admin_history",
                    "id,user_id,admin_user_id,action_type,action_amount,old_balance,new_balance,status,created_at",
                    [
                        {
                            type:"eq",
                            column:"user_id",
                            value:Number(userId)
                        },
                        {
                            type:"gte",
                            column:"created_at",
                            value:startISO
                        },
                        {
                            type:"lt",
                            column:"created_at",
                            value:endISO
                        }
                    ],
                    "created_at"
                );

        }catch(error){

            console.warn(
                "admin_history load nahi hua:",
                error
            );

            adminHistoryRows = [];

        }


        /* =====================================
           4. ADMIN WINING
        ===================================== */

        let adminWinningRows = [];

        try{

            adminWinningRows =
                await fetchAllRows(
                    "admin wining",
                    "id,user_id,amount,created_at,market",
                    [
                        {
                            type:"eq",
                            column:"user_id",
                            value:String(userId)
                        },
                        {
                            type:"gte",
                            column:"created_at",
                            value:startISO
                        },
                        {
                            type:"lt",
                            column:"created_at",
                            value:endISO
                        }
                    ],
                    "created_at"
                );

        }catch(error){

            console.warn(
                "admin wining load nahi hua:",
                error
            );

            adminWinningRows = [];

        }


        /* =====================================
           STATEMENT ARRAY
        ===================================== */

        let statement = [];


        /* =====================================
           DEPOSIT
        ===================================== */

        (depositRows || []).forEach(row => {

            const status =
                String(row.status || "")
                .toLowerCase();

            const accepted =
                status === "" ||
                status === "accepted" ||
                status === "approved" ||
                status === "success" ||
                status === "successful" ||
                status === "completed" ||
                status === "complete";

            if(!accepted){
                return;
            }

            const amount =
                Number(row.amount || 0);

            if(amount <= 0){
                return;
            }

            statement.push({

                id:
                    "deposit_" + row.id,

                source:
                    "deposit",

                created_at:
                    row.created_at,

                particulars:
                    "Deposit" +
                    (
                        row.utr
                        ? " - UTR " + row.utr
                        : ""
                    ),

                debit:
                    0,

                credit:
                    amount

            });

        });


        /* =====================================
           ADMIN HISTORY
        ===================================== */

        (adminHistoryRows || []).forEach(row => {

            const amount =
                Number(
                    row.action_amount || 0
                );

            if(amount <= 0){
                return;
            }

            const action =
                String(
                    row.action_type || ""
                ).toLowerCase();


            if(isWithdrawAction(action)){

                statement.push({

                    id:
                        "admin_withdraw_" +
                        row.id,

                    source:
                        "admin_history",

                    created_at:
                        row.created_at,

                    particulars:
                        "Withdraw",

                    debit:
                        amount,

                    credit:
                        0,

                    actualBalance:
                        row.new_balance

                });

                return;
            }


            if(isCreditAction(action)){

                /*
                   Deposit agar deposits table me already
                   aa chuka hai to duplicate avoid karne ki
                   koshish neeche hogi.
                */

                statement.push({

                    id:
                        "admin_credit_" +
                        row.id,

                    source:
                        "admin_history",

                    created_at:
                        row.created_at,

                    particulars:
                        action.includes("deposit")
                        ? "Deposit"
                        : "Wallet Credit",

                    debit:
                        0,

                    credit:
                        amount,

                    actualBalance:
                        row.new_balance

                });

                return;
            }

        });


        /* =====================================
           HISTORY
        ===================================== */

        let historyHasWinning = false;


        (historyRows || []).forEach(row => {

            const total =
                Number(row.total || 0);

            const winning =
                Number(row.win_amount || 0);

            const action =
                String(
                    row.action_type || ""
                ).toLowerCase();


            /*
              Agar history me explicit withdraw hai
            */

            if(
                isWithdrawAction(action) &&
                Number(row.action_amount || 0) > 0
            ){

                statement.push({

                    id:
                        "history_action_" +
                        row.id,

                    source:
                        "history",

                    created_at:
                        row.created_at,

                    particulars:
                        "Withdraw",

                    debit:
                        Number(row.action_amount),

                    credit:
                        0

                });

            }

            /*
              Agar history me explicit credit/deposit hai
            */

            else if(
                isCreditAction(action) &&
                Number(row.action_amount || 0) > 0
            ){

                statement.push({

                    id:
                        "history_credit_" +
                        row.id,

                    source:
                        "history",

                    created_at:
                        row.created_at,

                    particulars:
                        "Wallet Credit",

                    debit:
                        0,

                    credit:
                        Number(row.action_amount)

                });

            }

            /*
              Normal game entry
            */

            else if(total > 0){

                statement.push({

                    id:
                        "history_game_" +
                        row.id,

                    source:
                        "history",

                    created_at:
                        row.created_at,

                    particulars:
                        (
                            row.market
                            ? row.market + " - "
                            : ""
                        ) +
                        "Game / Bet",

                    debit:
                        total,

                    credit:
                        0

                });

            }


            /*
              Winning
            */

            if(winning > 0){

                historyHasWinning = true;

                statement.push({

                    id:
                        "history_win_" +
                        row.id,

                    source:
                        "history",

                    created_at:
                        row.created_at,

                    particulars:
                        (
                            row.market
                            ? row.market + " - "
                            : ""
                        ) +
                        "Winning",

                    debit:
                        0,

                    credit:
                        winning

                });

            }

        });


        /* =====================================
           ADMIN WINING
           
           Agar history me winning nahi hai tabhi
           admin wining ko credit me lenge.
           Isse duplicate winning se bachenge.
        ===================================== */

        if(!historyHasWinning){

            (adminWinningRows || []).forEach(row => {

                const amount =
                    Number(row.amount || 0);

                if(amount <= 0){
                    return;
                }

                statement.push({

                    id:
                        "admin_wining_" +
                        row.id,

                    source:
                        "admin_wining",

                    created_at:
                        row.created_at,

                    particulars:
                        (
                            row.market
                            ? row.market + " - "
                            : ""
                        ) +
                        "Winning",

                    debit:
                        0,

                    credit:
                        amount

                });

            });

        }


        /* =====================================
           DUPLICATE DEPOSIT REMOVE
        ===================================== */

        const finalStatement = [];

        statement.forEach(row => {

            if(
                row.source === "admin_history" &&
                row.credit > 0
            ){

                const duplicate =
                    finalStatement.some(existing => {

                        if(existing.source !== "deposit"){
                            return false;
                        }

                        if(existing.credit !== row.credit){
                            return false;
                        }

                        const t1 =
                            new Date(
                                existing.created_at
                            ).getTime();

                        const t2 =
                            new Date(
                                row.created_at
                            ).getTime();

                        return Math.abs(t1 - t2) <= 5 * 60 * 1000;

                    });

                if(duplicate){
                    return;
                }

            }

            finalStatement.push(row);

        });


        /* =====================================
           SORT BY TIME
        ===================================== */

        finalStatement.sort(
            (a,b) =>
                new Date(a.created_at) -
                new Date(b.created_at)
        );


        /* =====================================
           TOTAL
        ===================================== */

        let totalDebit = 0;
        let totalCredit = 0;


        finalStatement.forEach(row => {

            totalDebit +=
                Number(row.debit || 0);

            totalCredit +=
                Number(row.credit || 0);

        });


        /* =====================================
           TABLE
        ===================================== */

        if(finalStatement.length === 0){

            statementBody.innerHTML =
            `<tr>
                <td colspan="4" class="empty">
                    Is date par koi transaction nahi mila.
                </td>
            </tr>`;

        }else{

            let html = "";

            finalStatement.forEach(row => {

                const debit =
                    Number(row.debit || 0);

                const credit =
                    Number(row.credit || 0);


                html += `

                <tr>

                    <td>
                        ${formatDateTime(row.created_at)}
                    </td>

                    <td>
                        ${escapeHtml(row.particulars)}
                    </td>

                    <td class="debit">
                        ${
                            debit > 0
                            ? "₹" + money(debit)
                            : "-"
                        }
                    </td>

                    <td class="credit">
                        ${
                            credit > 0
                            ? "₹" + money(credit)
                            : "-"
                        }
                    </td>

                </tr>

                `;

            });


            html += `

            <tr class="total-row">

                <td colspan="2">
                    TOTAL
                </td>

                <td class="total-debit">
                    ₹${money(totalDebit)}
                </td>

                <td class="total-credit">
                    ₹${money(totalCredit)}
                </td>

            </tr>

            `;


            statementBody.innerHTML =
                html;

        }


        /* =====================================
           CURRENT WALLET
        ===================================== */

        const selectedBalance =
            Number(
                selectedOption.dataset.balance || 0
            );

        currentWallet.innerText =
            money(selectedBalance);

        walletBox.style.display = "block";


    }catch(error){

        console.error(error);

        statementBody.innerHTML =
        `<tr>
            <td colspan="4" class="empty">
                Statement load nahi hui.
            </td>
        </tr>`;

        showError(
            "Statement load error: " +
            error.message
        );

    }finally{

        loading.style.display = "none";

    }

}


/* =========================================
   HTML SAFE
========================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
